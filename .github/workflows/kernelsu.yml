name: Build KernelSU-Next SM6115 Kernel - GTA4L

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      - name: Verify build environment
        run: |
          set -e
          command -v make
          make --version
          command -v clang
          git --version
          
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/robot360-upload/android_kernel_samsung_sm6115.git \
            kernel

      - name: Clone LineageOS clang
        run: |
          git clone --depth=1 \
            --branch lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

      - name: Clone KernelSU-Next
        working-directory: kernel
        run: |
          git clone \
            --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

          echo "KernelSU-Next revision:"
          cd KernelSU-Next
          git rev-parse HEAD
          git describe --tags --always || true

      - name: Integrate KernelSU-Next
        working-directory: kernel
        run: |
          set -e

          echo "=== Creating KernelSU driver symlink ==="

          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          echo "=== Adding KernelSU to drivers/Makefile ==="

          grep -qxF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          echo "=== Adding KernelSU to drivers/Kconfig ==="

          grep -qxF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

          echo "=== Verifying integration ==="

          ls -l drivers/kernelsu

          grep -n "kernelsu" drivers/Makefile
          grep -n "drivers/kernelsu/Kconfig" drivers/Kconfig

      - name: Verify manual hooks
        working-directory: kernel
        run: |
          set -e

          echo "=== Checking KernelSU manual hooks ==="

          grep -n "ksu_handle_execveat" fs/exec.c
          grep -n "ksu_handle_faccessat" fs/open.c
          grep -n "ksu_handle_sys_read" fs/read_write.c
          grep -n "ksu_vfs_read_hook" fs/read_write.c
          grep -n "ksu_handle_stat" fs/stat.c
          grep -n "ksu_handle_sys_reboot" kernel/reboot.c

          echo "=== Hook check completed ==="

      - name: Prepare output directory
        working-directory: kernel
        run: |
          mkdir -p out

      - name: Configure kernel
        working-directory: kernel
        env:
          PATH: ${{ github.workspace }}/clang/bin:${{ env.PATH }}
        run: |
          set -e

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          unset CROSS_COMPILE
          unset CROSS_COMPILE_ARM32

          echo "=== Running vendor defconfig ==="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          echo "=== Merging GTA4L configuration ==="

          KCONFIG_CONFIG="${PWD}/out/.config" \
            ./scripts/kconfig/merge_config.sh \
            -m -r \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/gta4l-common.config

          echo "=== Enabling KernelSU-Next ==="

          ./scripts/config --file out/.config \
            --enable KSU \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_MANUAL_HOOK

          echo "=== Keeping required 32-bit compatibility ==="

          ./scripts/config --file out/.config \
            --enable COMPAT \
            --disable COMPAT_VDSO \
            --disable VDSO32

          echo "=== KernelSU-Next configuration ==="

          ./scripts/config --file out/.config \
            --enable KSU

          echo "=== Updating configuration ==="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "=== Relevant configuration ==="

          grep -E \
            '^(CONFIG_KSU|CONFIG_COMPAT=|CONFIG_COMPAT_VDSO|CONFIG_VDSO32|CONFIG_MODULES=|CONFIG_LTO_CLANG=|CONFIG_CFI_CLANG=|CONFIG_SHADOW_CALL_STACK=|CONFIG_KALLSYMS_ALL=|CONFIG_GTA4L_DTB=)' \
            out/.config || true

      - name: Build kernel
        working-directory: kernel
        env:
          PATH: ${{ github.workspace }}/clang/bin:${{ env.PATH }}
        run: |
          set -e

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          unset CROSS_COMPILE
          unset CROSS_COMPILE_ARM32

          echo "=== Building Image and Image.gz ==="

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image Image.gz

      - name: Verify kernel outputs
        working-directory: kernel
        run: |
          set -e

          echo "=== Build outputs ==="

          ls -lh out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image.gz

          echo "=== File information ==="

          file out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image.gz

          echo "=== KernelSU objects ==="

          find out -path '*kernelsu*' -type f | head -50 || true

      - name: Prepare artifacts
        working-directory: kernel
        run: |
          mkdir -p artifacts

          cp out/arch/arm64/boot/Image \
            artifacts/gta4l-kernelsu-next-Image

          cp out/arch/arm64/boot/Image.gz \
            artifacts/gta4l-kernelsu-next-Image.gz

          cp out/.config \
            artifacts/gta4l-kernelsu-next.config

          cp System.map \
            artifacts/gta4l-kernelsu-next-System.map \
            2>/dev/null || true

          echo "=== Artifacts ==="
          ls -lh artifacts/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-kernelsu-next-kernel
          path: kernel/artifacts/
          if-no-files-found: error
