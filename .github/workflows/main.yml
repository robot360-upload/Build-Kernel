name: Build ReSukiSU SM6115 Kernel - GTA4L

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ReSukiSU LineageOS SM6115 / GTA4L
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # LINEAGEOS SM6115 KERNEL
      # ============================================================
      - name: Clone LineageOS SM6115 kernel
        run: |
          set -eux

          mkdir -p kernel/samsung

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_samsung_sm6115.git \
            kernel/samsung/sm6115

          cd kernel/samsung/sm6115

          echo "===== KERNEL REVISION ====="
          git rev-parse HEAD

          echo
          echo "===== KERNEL VERSION ====="
          make kernelversion

      # ============================================================
      # EXACT LINEAGEOS CLANG r416183b
      # ============================================================
      - name: Clone LineageOS Clang r416183b
        run: |
          set -eux

          mkdir -p toolchain

          git clone \
            --depth=1 \
            --branch lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            toolchain/clang-r416183b

          echo
          echo "===== CLANG VERSION ====="

          toolchain/clang-r416183b/bin/clang --version

          echo
          echo "===== LLD VERSION ====="

          toolchain/clang-r416183b/bin/ld.lld --version

      # ============================================================
      # INSTALL RESUKISU
      # ============================================================
      - name: Install ReSukiSU
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          echo "========================================"
          echo "Clone ReSukiSU"
          echo "========================================"

          git clone \
            --depth=1 \
            --single-branch \
            https://github.com/ReSukiSU/ReSukiSU.git \
            KernelSU

          echo
          echo "===== RESUKISU REVISION ====="

          cd KernelSU
          git rev-parse HEAD
          cd ..

          echo
          echo "========================================"
          echo "Create KernelSU driver symlink"
          echo "========================================"

          ln -s \
            ../KernelSU/kernel \
            drivers/kernelsu

          test -L drivers/kernelsu
          test -e drivers/kernelsu/Kconfig
          test -e drivers/kernelsu/Makefile

          echo "[PASS] drivers/kernelsu symlink"

          echo
          echo "========================================"
          echo "Register KernelSU in drivers/Kconfig"
          echo "========================================"

          if ! grep -q \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig; then

            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          echo
          echo "========================================"
          echo "Register KernelSU in drivers/Makefile"
          echo "========================================"

          if ! grep -q \
            'obj-\$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile; then

            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          echo
          echo "===== KERNELSU REGISTRATION ====="

          grep -n \
            'kernelsu' \
            drivers/Kconfig \
            drivers/Makefile

      # ============================================================
      # FORCE RESUKISU MANUAL-HOOK KCONFIG DEFAULT
      # ============================================================
      - name: Configure ReSukiSU Kconfig default
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          KSU_KCONFIG="drivers/kernelsu/Kconfig"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/kernelsu/Kconfig")
          text = path.read_text()

          old = "default KSU_TRACEPOINT_HOOK"
          new = "default KSU_MANUAL_HOOK"

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit(
                  "[FAIL] Could not find KernelSU hooking-method default"
              )

          path.write_text(text)

          print("[PASS] Manual Hook is the Kconfig default")
          PY

          grep -n \
            -A8 \
            -B3 \
            'default KSU_MANUAL_HOOK' \
            "${KSU_KCONFIG}"

      # ============================================================
      # APPLY RESUKISU MANUAL HOOKS
      #
      # Linux 4.19:
      #
      #   fs/exec.c
      #   fs/stat.c
      #   fs/open.c
      #   fs/read_write.c
      #   kernel/reboot.c
      #
      # The hook statements are deliberately placed AFTER existing
      # local declarations to satisfy this kernel's C90 warning
      # policy (-Werror,-Wdeclaration-after-statement).
      # ============================================================
      - name: Apply ReSukiSU manual hooks
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def require(text, needle, description):
              if needle not in text:
                  raise RuntimeError(
                      f"[FAIL] Missing {description}: {needle}"
                  )

          # ========================================================
          # fs/exec.c
          # ========================================================

          path = "fs/exec.c"
          text = read(path)

          exec_decl = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                          void *argv, void *envp, int *flags);
          __attribute__((hot))
          extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr,
                          void *argv, void *envp, int *flags, int *retval);
          #endif

          """

          if "ksu_handle_execveat" not in text:
              marker = "static int do_execveat_common("
              pos = text.find(marker)

              if pos < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate do_execveat_common"
                  )

              text = text[:pos] + exec_decl + text[pos:]

          # Patch the exact 4.19 do_execveat_common body.
          old = """\
          {
              return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          }
          """

          new = """\
          {
          #ifdef CONFIG_KSU_MANUAL_HOOK
              int retval;

              ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);

              retval = __do_execve_file(fd, filename, argv, envp, flags, NULL);

              ksu_handle_post_execveat(
                  &fd, &filename, &argv, &envp, &flags, &retval);

              return retval;
          #else
              return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          #endif
          }
          """

          if "ksu_handle_post_execveat" not in text:
              pos = text.find("static int do_execveat_common(")

              if pos < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate do_execveat_common"
                  )

              end = text.find(
                  "\n}\n",
                  text.find("{", pos)
              )

              if end < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate do_execveat_common end"
                  )

              body = text[pos:end + 3]

              if old not in body:
                  raise RuntimeError(
                      "[FAIL] Unexpected do_execveat_common body"
                  )

              body = body.replace(old, new, 1)

              text = (
                  text[:pos] +
                  body +
                  text[end + 3:]
              )

          write(path, text)

          # ========================================================
          # fs/stat.c
          # ========================================================

          path = "fs/stat.c"
          text = read(path)

          stat_decl = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
                          const char __user **filename_user,
                          int *flags);

          extern void ksu_handle_newfstat_ret(
                          unsigned int *fd,
                          struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
                          unsigned long *fd,
                          struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          """

          if "ksu_handle_stat" not in text:
              marker = "SYSCALL_DEFINE4(newfstatat"
              pos = text.find(marker)

              if pos < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate newfstatat"
                  )

              text = text[:pos] + stat_decl + text[pos:]

          # --------------------------------------------------------
          # newfstatat
          # --------------------------------------------------------

          if "ksu_handle_stat(&dfd, &filename, &flag)" not in text:
              marker = "SYSCALL_DEFINE4(newfstatat"
              start = text.find(marker)
              brace = text.find("{", start)
              end = text.find("\n}", brace)

              if start < 0 or brace < 0 or end < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate newfstatat body"
                  )

              body = text[brace + 1:end]

              needle = """\
              struct kstat stat;
              int error;
              """

              if needle not in body:
                  raise RuntimeError(
                      "[FAIL] Unexpected newfstatat declarations"
                  )

              replacement = needle + """
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_stat(&dfd, &filename, &flag);
          #endif
              """

              body = body.replace(
                  needle,
                  replacement,
                  1
              )

              text = (
                  text[:brace + 1] +
                  body +
                  text[end:]
              )

          # --------------------------------------------------------
          # fstatat64
          # --------------------------------------------------------

          if "ksu_handle_stat(&dfd, &filename, &flag)" in text:
              marker = "SYSCALL_DEFINE4(fstatat64"

              if marker in text and text.count(
                  "ksu_handle_stat(&dfd, &filename, &flag)"
              ) < 2:

                  start = text.find(marker)
                  brace = text.find("{", start)
                  end = text.find("\n}", brace)

                  if start < 0 or brace < 0 or end < 0:
                      raise RuntimeError(
                          "[FAIL] Could not locate fstatat64 body"
                      )

                  body = text[brace + 1:end]

                  needle = """\
              struct kstat stat;
              int error;
              """

                  if needle not in body:
                      raise RuntimeError(
                          "[FAIL] Unexpected fstatat64 declarations"
                      )

                  replacement = needle + """
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_stat(&dfd, &filename, &flag);
          #endif
              """

                  body = body.replace(
                      needle,
                      replacement,
                      1
                  )

                  text = (
                      text[:brace + 1] +
                      body +
                      text[end:]
                  )

          # --------------------------------------------------------
          # newfstat return hook
          # --------------------------------------------------------

          if "ksu_handle_newfstat_ret(&fd, &statbuf)" not in text:
              marker = "SYSCALL_DEFINE2(newfstat"
              start = text.find(marker)
              brace = text.find("{", start)
              end = text.find("\n}", brace)

              if start < 0 or brace < 0 or end < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate newfstat"
                  )

              body = text[brace + 1:end]

              needle = """
              return error;
              """

              if needle not in body:
                  raise RuntimeError(
                      "[FAIL] Could not locate newfstat return"
                  )

              replacement = """
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
              return error;
              """

              body = body.replace(
                  needle,
                  replacement,
                  1
              )

              text = (
                  text[:brace + 1] +
                  body +
                  text[end:]
              )

          # --------------------------------------------------------
          # fstat64 return hook
          # --------------------------------------------------------

          if "ksu_handle_fstat64_ret(&fd, &statbuf)" not in text:
              marker = "SYSCALL_DEFINE2(fstat64"

              if marker in text:
                  start = text.find(marker)
                  brace = text.find("{", start)
                  end = text.find("\n}", brace)

                  if start < 0 or brace < 0 or end < 0:
                      raise RuntimeError(
                          "[FAIL] Could not locate fstat64"
                      )

                  body = text[brace + 1:end]

                  needle = """
              return error;
                  """

                  if needle not in body:
                      raise RuntimeError(
                          "[FAIL] Could not locate fstat64 return"
                      )

                  replacement = """
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
              return error;
                  """

                  body = body.replace(
                      needle,
                      replacement,
                      1
                  )

                  text = (
                      text[:brace + 1] +
                      body +
                      text[end:]
                  )

          write(path, text)

          # ========================================================
          # fs/open.c
          # ========================================================

          path = "fs/open.c"
          text = read(path)

          faccess_decl = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(
                          int *dfd,
                          const char __user **filename_user,
                          int *mode,
                          int *flags);
          #endif

          """

          if "ksu_handle_faccessat" not in text:
              marker = "SYSCALL_DEFINE3(faccessat"
              pos = text.find(marker)

              if pos < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate faccessat"
                  )

              text = text[:pos] + faccess_decl + text[pos:]

          if "ksu_handle_faccessat(&dfd, &filename, &mode, NULL)" not in text:
              marker = "SYSCALL_DEFINE3(faccessat"
              start = text.find(marker)
              brace = text.find("{", start)

              if start < 0 or brace < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate faccessat body"
                  )

              hook = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          """

              text = text[:brace + 1] + "\n" + hook + text[brace + 1:]

          write(path, text)

          # ========================================================
          # kernel/reboot.c
          # ========================================================

          path = "kernel/reboot.c"
          text = read(path)

          reboot_decl = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(
                          int magic1,
                          int magic2,
                          unsigned int cmd,
                          void __user **arg);
          #endif

          """

          if "ksu_handle_sys_reboot" not in text:
              marker = "SYSCALL_DEFINE4(reboot"
              pos = text.find(marker)

              if pos < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate reboot syscall"
                  )

              text = text[:pos] + reboot_decl + text[pos:]

          if "ksu_handle_sys_reboot(magic1, magic2, cmd, &arg)" not in text:
              marker = "SYSCALL_DEFINE4(reboot"
              start = text.find(marker)
              brace = text.find("{", start)
              end = text.find("\n}", brace)

              if start < 0 or brace < 0 or end < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate reboot body"
                  )

              body = text[brace + 1:end]

              needle = """\
              struct pid_namespace *pid_ns = task_active_pid_ns(current);
              char buffer[256];
              int ret = 0;
              """

              if needle not in body:
                  raise RuntimeError(
                      "[FAIL] Unexpected reboot declarations"
                  )

              replacement = needle + """
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif
              """

              body = body.replace(
                  needle,
                  replacement,
                  1
              )

              text = (
                  text[:brace + 1] +
                  body +
                  text[end:]
              )

          write(path, text)

          # ========================================================
          # fs/read_write.c
          # ========================================================

          path = "fs/read_write.c"
          text = read(path)

          read_decl = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern bool ksu_init_rc_hook __read_mostly;
          extern __attribute__((cold)) int ksu_handle_sys_read(
                          unsigned int fd,
                          char __user **buf_ptr,
                          size_t *count_ptr);
          #endif

          """

          if "ksu_handle_sys_read" not in text:
              marker = "SYSCALL_DEFINE3(read"
              pos = text.find(marker)

              if pos < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate read syscall"
                  )

              text = text[:pos] + read_decl + text[pos:]

          if "ksu_handle_sys_read(fd, &buf, &count)" not in text:
              marker = "SYSCALL_DEFINE3(read"
              start = text.find(marker)
              brace = text.find("{", start)

              if start < 0 or brace < 0:
                  raise RuntimeError(
                      "[FAIL] Could not locate read body"
                  )

              # For the 4.19+ version used here, read() directly calls
              # ksys_read(), so the hook is safely placed first.
              needle = "return ksys_read(fd, buf, count);"

              if needle not in text[brace:]:
                  raise RuntimeError(
                      "[FAIL] Could not locate ksys_read return"
                  )

              hook = """\
          #ifdef CONFIG_KSU_MANUAL_HOOK
              if (unlikely(ksu_init_rc_hook))
                  ksu_handle_sys_read(fd, &buf, &count);
          #endif

          """

              return_pos = text.find(needle, brace)

              text = (
                  text[:return_pos] +
                  hook +
                  text[return_pos:]
              )

          write(path, text)

          print()
          print("========================================")
          print("Manual hook patching complete")
          print("========================================")
          PY

      # ============================================================
      # VERIFY MANUAL HOOKS
      # ============================================================
      - name: Verify ReSukiSU manual hooks
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          echo "===== EXECVE ====="

          grep -n \
            'ksu_handle_execveat' \
            fs/exec.c

          grep -n \
            'ksu_handle_post_execveat' \
            fs/exec.c

          echo
          echo "===== STAT ====="

          grep -n \
            'ksu_handle_stat' \
            fs/stat.c

          grep -n \
            'ksu_handle_newfstat_ret' \
            fs/stat.c

          grep -n \
            'ksu_handle_fstat64_ret' \
            fs/stat.c

          echo
          echo "===== FACCESSAT ====="

          grep -n \
            'ksu_handle_faccessat' \
            fs/open.c

          echo
          echo "===== REBOOT ====="

          grep -n \
            'ksu_handle_sys_reboot' \
            kernel/reboot.c

          echo
          echo "===== READ ====="

          grep -n \
            'ksu_handle_sys_read' \
            fs/read_write.c

          echo
          echo "[PASS] Required manual-hook symbols present"

      # ============================================================
      # CONFIGURATION
      #
      # Same successful pipeline as the vanilla build:
      #
      #   bengal-perf_defconfig
      #        ↓
      #   merge GTA4L config
      #        ↓
      #   merge ReSukiSU config
      #        ↓
      #   olddefconfig
      #
      # COMPAT remains enabled.
      # COMPAT_VDSO is explicitly disabled.
      # ============================================================
      - name: Configure GTA4L + ReSukiSU
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/toolchain/clang-r416183b/bin"
          export PATH="${CLANG_PREBUILT_BIN}:${PATH}"

          rm -rf out
          mkdir -p out

          echo "========================================"
          echo "TOOLCHAIN CHECK"
          echo "========================================"

          command -v clang
          clang --version

          command -v ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "VERIFY GTA4L CONFIG FILES"
          echo "========================================"

          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f arch/arm64/configs/vendor/gta4l-common.config

          echo "[PASS] bengal-perf_defconfig"
          echo "[PASS] gta4l-common.config"

          echo
          echo "========================================"
          echo "CREATE BASE CONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          echo
          echo "========================================"
          echo "MERGE GTA4L FRAGMENT"
          echo "========================================"

          KCONFIG_CONFIG="${PWD}/out/.config" \
            ./scripts/kconfig/merge_config.sh \
              -m \
              -r \
              -O out \
              out/.config \
              arch/arm64/configs/vendor/gta4l-common.config

          echo
          echo "========================================"
          echo "CREATE RESUKISU CONFIG"
          echo "========================================"

          cat > out/resukisu.config <<'EOF'

          # ReSukiSU
          CONFIG_KSU=y
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          CONFIG_KSU_MANUAL_HOOK=y

          # ========================================================
          # Keep 32-bit userspace compatibility.
          # Disable ONLY the 32-bit compat vDSO.
          # ========================================================
          CONFIG_COMPAT=y
          # CONFIG_COMPAT_VDSO is not set
          # CONFIG_VDSO32 is not set
          EOF

          echo
          echo "===== RESUKISU CONFIG FRAGMENT ====="

          cat out/resukisu.config

          echo
          echo "========================================"
          echo "MERGE RESUKISU CONFIG"
          echo "========================================"

          KCONFIG_CONFIG="${PWD}/out/.config" \
            ./scripts/kconfig/merge_config.sh \
              -m \
              -r \
              -O out \
              out/.config \
              out/resukisu.config

          echo
          echo "========================================"
          echo "FINALIZE CONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "========================================"
          echo "FINAL CONFIG"
          echo "========================================"

          grep -E \
            '^(CONFIG_COMPAT|CONFIG_COMPAT_VDSO|CONFIG_VDSO32|CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK)=' \
            out/.config \
            || true

          echo
          grep -E \
            '^# CONFIG_(COMPAT_VDSO|VDSO32|KSU_TRACEPOINT_HOOK) is not set' \
            out/.config \
            || true

          echo
          echo "========================================"
          echo "VERIFY CRITICAL OPTIONS"
          echo "========================================"

          test "$(grep -c '^CONFIG_COMPAT=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_MODULES=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_LTO_CLANG=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_CFI_CLANG=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_SHADOW_CALL_STACK=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_GTA4L_DTB=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_KERNEL_GZIP=y$' out/.config)" -eq 1

          test "$(grep -c '^CONFIG_KSU=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config)" -eq 1

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config; then
            echo "[FAIL] CONFIG_KSU_TRACEPOINT_HOOK=y"
            exit 1
          fi

          if grep -q '^CONFIG_COMPAT_VDSO=y$' out/.config; then
            echo "[FAIL] CONFIG_COMPAT_VDSO=y"
            echo "The 32-bit compat vDSO must be disabled."
            exit 1
          fi

          if grep -q '^CONFIG_VDSO32=y$' out/.config; then
            echo "[FAIL] CONFIG_VDSO32=y"
            echo "The 32-bit vDSO must be disabled."
            exit 1
          fi

          if grep -q '^CONFIG_COMPAT_VDSO=y' out/.config; then
            echo "[FAIL] compat VDSO is still enabled"
            exit 1
          fi

          echo
          echo "========================================"
          echo "VERIFIED CONFIG"
          echo "========================================"

          grep -E \
            '^(CONFIG_COMPAT|CONFIG_MODULES|CONFIG_LTO_CLANG|CONFIG_CFI_CLANG|CONFIG_SHADOW_CALL_STACK|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|CONFIG_GTA4L_DTB|CONFIG_KERNEL_GZIP|CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK)=' \
            out/.config

          echo
          echo "===== VDSO SETTINGS ====="

          grep -E \
            '^(CONFIG_COMPAT_VDSO|CONFIG_VDSO32)=|^# CONFIG_(COMPAT_VDSO|VDSO32) is not set' \
            out/.config \
            || true

          echo
          echo "===== CONFIG COMPLETE ====="

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build ReSukiSU kernel
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/toolchain/clang-r416183b/bin"
          export PATH="${CLANG_PREBUILT_BIN}:${PATH}"

          echo "========================================"
          echo "FINAL COMPILER"
          echo "========================================"

          command -v clang
          clang --version

          command -v ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "BUILD RAW IMAGE + COMPRESSED IMAGE"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image Image.gz

      # ============================================================
      # VERIFY OUTPUT
      # ============================================================
      - name: Verify kernel artifacts
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          echo "========================================"
          echo "BOOT DIRECTORY"
          echo "========================================"

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          echo
          echo "========================================"
          echo "REQUIRED FILES"
          echo "========================================"

          test -f out/arch/arm64/boot/Image
          test -f out/arch/arm64/boot/Image.gz
          test -f out/vmlinux
          test -f out/System.map
          test -f out/.config

          echo
          echo "===== RAW IMAGE ====="

          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

          echo
          echo "===== COMPRESSED IMAGE ====="

          file out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== VMLINUX ====="

          ls -lh out/vmlinux

          echo
          echo "===== SYSTEM MAP ====="

          ls -lh out/System.map

          echo
          echo "===== FINAL CONFIG HASH ====="

          sha256sum out/.config

          echo
          echo "===== RAW KERNEL HASH ====="

          sha256sum out/arch/arm64/boot/Image

          echo
          echo "===== COMPRESSED KERNEL HASH ====="

          sha256sum out/arch/arm64/boot/Image.gz

          echo
          echo "===== RAW IMAGE HEADER ====="

          xxd -l 16 out/arch/arm64/boot/Image

          echo
          echo "===== GZIP HEADER ====="

          xxd -l 16 out/arch/arm64/boot/Image.gz

      # ============================================================
      # PACKAGE ARTIFACTS
      # ============================================================
      - name: Prepare artifacts
        run: |
          set -eux

          mkdir -p artifacts

          cp \
            kernel/samsung/sm6115/out/arch/arm64/boot/Image \
            artifacts/Image

          cp \
            kernel/samsung/sm6115/out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          cp \
            kernel/samsung/sm6115/out/.config \
            artifacts/gta4l-resukisu.config

          cp \
            kernel/samsung/sm6115/out/System.map \
            artifacts/System.map

          cp \
            kernel/samsung/sm6115/out/vmlinux \
            artifacts/vmlinux

          cp \
            kernel/samsung/sm6115/arch/arm64/configs/vendor/bengal-perf_defconfig \
            artifacts/bengal-perf_defconfig

          cp \
            kernel/samsung/sm6115/arch/arm64/configs/vendor/gta4l-common.config \
            artifacts/gta4l-common.config

          cp \
            kernel/samsung/sm6115/out/resukisu.config \
            artifacts/resukisu.config

          echo
          echo "========================================"
          echo "ARTIFACTS"
          echo "========================================"

          ls -lh artifacts/

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload ReSukiSU kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-resukisu-kernel
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
