name: Build ReSukiSU SM6115 Kernel - GTA4L

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ReSukiSU LineageOS SM6115 / GTA4L
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # LINEAGEOS SM6115 KERNEL
      # ============================================================
      - name: Clone LineageOS SM6115 kernel
        run: |
          set -eux

          mkdir -p kernel/samsung

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_samsung_sm6115.git \
            kernel/samsung/sm6115

          cd kernel/samsung/sm6115

          echo "===== KERNEL REVISION ====="
          git rev-parse HEAD

          echo
          echo "===== KERNEL VERSION ====="
          make kernelversion

      # ============================================================
      # EXACT LINEAGEOS CLANG r416183b
      # ============================================================
      - name: Clone LineageOS Clang r416183b
        run: |
          set -eux

          mkdir -p toolchain

          git clone \
            --depth=1 \
            --branch lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            toolchain/clang-r416183b

          echo
          echo "===== CLANG VERSION ====="

          toolchain/clang-r416183b/bin/clang --version

          echo
          echo "===== LLD VERSION ====="

          toolchain/clang-r416183b/bin/ld.lld --version

      # ============================================================
      # INSTALL RESUKISU
      # ============================================================
      - name: Install ReSukiSU
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          echo "========================================"
          echo "Clone ReSukiSU"
          echo "========================================"

          git clone \
            --depth=1 \
            --single-branch \
            https://github.com/ReSukiSU/ReSukiSU.git \
            KernelSU

          echo
          echo "===== RESUKISU REVISION ====="

          cd KernelSU
          git rev-parse HEAD
          cd ..

          echo
          echo "========================================"
          echo "Create KernelSU driver symlink"
          echo "========================================"

          ln -s \
            ../KernelSU/kernel \
            drivers/kernelsu

          test -L drivers/kernelsu
          test -e drivers/kernelsu/Kconfig
          test -e drivers/kernelsu/Makefile

          echo "[PASS] drivers/kernelsu symlink"

          echo
          echo "========================================"
          echo "Register KernelSU in drivers/Kconfig"
          echo "========================================"

          if ! grep -q \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig; then

            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          echo
          echo "========================================"
          echo "Register KernelSU in drivers/Makefile"
          echo "========================================"

          if ! grep -q \
            'obj-\$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile; then

            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          echo
          echo "===== KERNELSU REGISTRATION ====="

          grep -n \
            'kernelsu' \
            drivers/Kconfig \
            drivers/Makefile

      # ============================================================
      # FORCE RESUKISU MANUAL-HOOK KCONFIG DEFAULT
      # ============================================================
      - name: Configure ReSukiSU Kconfig default
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          KSU_KCONFIG="drivers/kernelsu/Kconfig"

          python3 <<'PY'
          from pathlib import Path

          path = Path("drivers/kernelsu/Kconfig")
          text = path.read_text()

          old = "default KSU_TRACEPOINT_HOOK"
          new = "default KSU_MANUAL_HOOK"

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit(
                  "[FAIL] Could not find KernelSU hooking-method default"
              )

          path.write_text(text)

          print("[PASS] Manual Hook is the Kconfig default")
          PY

          grep -n \
            -A8 \
            -B3 \
            'default KSU_MANUAL_HOOK' \
            "${KSU_KCONFIG}"

      # ============================================================
      # APPLY RESUKISU MANUAL HOOKS
      #
      # Linux 4.19 hooks:
      #
      #   fs/exec.c
      #   fs/stat.c
      #   fs/open.c
      #   fs/read_write.c
      #   kernel/reboot.c
      #
      # This patcher is deliberately brace-aware. It does NOT depend
      # on the exact whitespace/indentation of the kernel source.
      # ============================================================
      - name: Apply ReSukiSU manual hooks
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path.cwd()

          def fail(message):
              raise RuntimeError(f"[FAIL] {message}")

          def read_file(path):
              path = ROOT / path

              if not path.exists():
                  fail(f"Missing file: {path}")

              return path.read_text()

          def write_file(path, text):
              (ROOT / path).write_text(text)

          def find_matching_brace(text, open_pos):
              """
              Find the closing brace corresponding to open_pos.

              Braces inside comments, strings and character literals
              are ignored.
              """

              if open_pos < 0 or open_pos >= len(text):
                  fail("Invalid opening-brace position")

              if text[open_pos] != "{":
                  fail("Position does not contain an opening brace")

              depth = 0
              i = open_pos
              length = len(text)

              in_line_comment = False
              in_block_comment = False
              in_string = False
              in_char = False
              escaped = False

              while i < length:
                  c = text[i]

                  nxt = ""
                  if i + 1 < length:
                      nxt = text[i + 1]

                  # --------------------------------------------------
                  # Line comment
                  # --------------------------------------------------
                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False

                      i += 1
                      continue

                  # --------------------------------------------------
                  # Block comment
                  # --------------------------------------------------
                  if in_block_comment:
                      if c == "*" and nxt == "/":
                          in_block_comment = False
                          i += 2
                      else:
                          i += 1

                      continue

                  # --------------------------------------------------
                  # String literal
                  # --------------------------------------------------
                  if in_string:
                      if escaped:
                          escaped = False

                      elif c == "\\":
                          escaped = True

                      elif c == '"':
                          in_string = False

                      i += 1
                      continue

                  # --------------------------------------------------
                  # Character literal
                  # --------------------------------------------------
                  if in_char:
                      if escaped:
                          escaped = False

                      elif c == "\\":
                          escaped = True

                      elif c == "'":
                          in_char = False

                      i += 1
                      continue

                  # --------------------------------------------------
                  # Enter comment
                  # --------------------------------------------------
                  if c == "/" and nxt == "/":
                      in_line_comment = True
                      i += 2
                      continue

                  if c == "/" and nxt == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  # --------------------------------------------------
                  # Enter string/character literal
                  # --------------------------------------------------
                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  # --------------------------------------------------
                  # Brace tracking
                  # --------------------------------------------------
                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return i

                  i += 1

              fail("Could not find matching closing brace")

          def find_function(text, marker):
              """
              Locate a function-like construct using a unique marker.

              Returns:
                  start
                  opening brace
                  closing brace
              """

              start = text.find(marker)

              if start < 0:
                  fail(f"Could not find function marker: {marker}")

              open_brace = text.find("{", start)

              if open_brace < 0:
                  fail(f"Could not find opening brace for: {marker}")

              close_brace = find_matching_brace(text, open_brace)

              return start, open_brace, close_brace

          def replace_function(path, marker, replacement):
              text = read_file(path)

              start, open_brace, close_brace = find_function(
                  text,
                  marker
              )

              old = text[start:close_brace + 1]

              print()
              print("========================================")
              print(f"PATCH {path}")
              print(marker)
              print("========================================")

              text = (
                  text[:start]
                  + replacement.rstrip()
                  + text[close_brace + 1:]
              )

              write_file(path, text)

              if replacement.strip() not in text:
                  fail(
                      f"Replacement verification failed for {marker}"
                  )

              print(f"[PASS] {marker}")

          # ============================================================
          # fs/exec.c
          # ============================================================

          path = "fs/exec.c"
          text = read_file(path)

          exec_decl = r'''#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd,
                                         struct filename **filename_ptr,
                                         void *argv,
                                         void *envp,
                                         int *flags);

          __attribute__((hot))
          extern int ksu_handle_post_execveat(
                                         int *fd,
                                         struct filename **filename_ptr,
                                         void *argv,
                                         void *envp,
                                         int *flags,
                                         int *retval);
          #endif

          '''

          if "extern int ksu_handle_execveat(" not in text:
              marker = "static int do_execveat_common("

              pos = text.find(marker)

              if pos < 0:
                  fail("Could not locate do_execveat_common()")

              text = text[:pos] + exec_decl + text[pos:]

              write_file(path, text)

              text = read_file(path)

          # Find the actual function.
          start, open_brace, close_brace = find_function(
              text,
              "do_execveat_common("
          )

          old_function = text[start:close_brace + 1]

          if "__do_execve_file(fd, filename, argv, envp, flags, NULL)" not in old_function:
              fail(
                  "Unexpected do_execveat_common() body; "
                  "kernel source does not match expected 4.19 implementation"
              )

          if "ksu_handle_post_execveat(" not in old_function:

              new_function = r'''do_execveat_common(int fd, struct filename *filename,
				struct user_arg_ptr argv,
				struct user_arg_ptr envp,
				int flags)
          {
          	int retval;

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);

          	retval = __do_execve_file(
          		fd, filename, argv, envp, flags, NULL);

          	ksu_handle_post_execveat(
          		&fd, &filename, &argv, &envp, &flags, &retval);

          	return retval;
          #else
          	return __do_execve_file(
          		fd, filename, argv, envp, flags, NULL);
          #endif
          }'''

              text = (
                  text[:start]
                  + new_function
                  + text[close_brace + 1:]
              )

              write_file(path, text)

              print("[PASS] do_execveat_common() patched")

          else:
              print("[SKIP] execve hooks already present")

          # ============================================================
          # fs/stat.c
          # ============================================================

          path = "fs/stat.c"
          text = read_file(path)

          stat_decl = r'''#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(
          		int *dfd,
          		const char __user **filename_user,
          		int *flags);

          extern void ksu_handle_newfstat_ret(
          		unsigned int *fd,
          		struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
          		unsigned long *fd,
          		struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          '''

          if "extern int ksu_handle_stat(" not in text:

              marker = "SYSCALL_DEFINE4(newfstatat,"

              pos = text.find(marker)

              if pos < 0:
                  fail("Could not locate native newfstatat()")

              text = text[:pos] + stat_decl + text[pos:]

              write_file(path, text)

              text = read_file(path)

          # ------------------------------------------------------------
          # native newfstatat()
          # ------------------------------------------------------------

          text = read_file(path)

          start, open_brace, close_brace = find_function(
              text,
              "SYSCALL_DEFINE4(newfstatat,"
          )

          function = text[start:close_brace + 1]

          if "ksu_handle_stat(&dfd, &filename, &flag);" not in function:

              declaration_marker = "\tint error;"

              pos = function.find(declaration_marker)

              if pos < 0:
                  fail(
                      "Could not locate local declarations in "
                      "newfstatat()"
                  )

              insert_pos = pos + len(declaration_marker)

              hook = r'''

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_stat(&dfd, &filename, &flag);
          #endif'''

              function = (
                  function[:insert_pos]
                  + hook
                  + function[insert_pos:]
              )

              text = (
                  text[:start]
                  + function
                  + text[close_brace + 1:]
              )

              write_file(path, text)

              print("[PASS] native newfstatat() patched")

          else:
              print("[SKIP] newfstatat() already patched")

          # ------------------------------------------------------------
          # native newfstat()
          # ------------------------------------------------------------

          text = read_file(path)

          start, open_brace, close_brace = find_function(
              text,
              "SYSCALL_DEFINE2(newfstat,"
          )

          function = text[start:close_brace + 1]

          if "ksu_handle_newfstat_ret(&fd, &statbuf);" not in function:

              marker = "\treturn error;"

              pos = function.find(marker)

              if pos < 0:
                  fail(
                      "Could not locate return error in newfstat()"
                  )

              hook = r'''#ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif

          '''

              function = (
                  function[:pos]
                  + hook
                  + function[pos:]
              )

              text = (
                  text[:start]
                  + function
                  + text[close_brace + 1:]
              )

              write_file(path, text)

              print("[PASS] newfstat() patched")

          else:
              print("[SKIP] newfstat() already patched")

          # ------------------------------------------------------------
          # native fstat64()
          # ------------------------------------------------------------

          text = read_file(path)

          start, open_brace, close_brace = find_function(
              text,
              "SYSCALL_DEFINE2(fstat64,"
          )

          function = text[start:close_brace + 1]

          if "ksu_handle_fstat64_ret(&fd, &statbuf);" not in function:

              marker = "\treturn error;"

              pos = function.find(marker)

              if pos < 0:
                  fail(
                      "Could not locate return error in fstat64()"
                  )

              hook = r'''#ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_fstat64_ret(&fd, &statbuf);
          #endif

          '''

              function = (
                  function[:pos]
                  + hook
                  + function[pos:]
              )

              text = (
                  text[:start]
                  + function
                  + text[close_brace + 1:]
              )

              write_file(path, text)

              print("[PASS] fstat64() patched")

          else:
              print("[SKIP] fstat64() already patched")

          # ------------------------------------------------------------
          # native fstatat64()
          # ------------------------------------------------------------

          text = read_file(path)

          if "SYSCALL_DEFINE4(fstatat64," in text:

              start, open_brace, close_brace = find_function(
                  text,
                  "SYSCALL_DEFINE4(fstatat64,"
              )

              function = text[start:close_brace + 1]

              if "ksu_handle_stat(&dfd, &filename, &flag);" not in function:

                  marker = "\tint error;"

                  pos = function.find(marker)

                  if pos < 0:
                      fail(
                          "Could not locate local declarations in "
                          "fstatat64()"
                      )

                  insert_pos = pos + len(marker)

                  hook = r'''

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_stat(&dfd, &filename, &flag);
          #endif'''

                  function = (
                      function[:insert_pos]
                      + hook
                      + function[insert_pos:]
                  )

                  text = (
                      text[:start]
                      + function
                      + text[close_brace + 1:]
                  )

                  write_file(path, text)

                  print("[PASS] fstatat64() patched")

              else:
                  print("[SKIP] fstatat64() already patched")

          else:
              print("[INFO] fstatat64() not present")

          # ============================================================
          # fs/open.c - faccessat
          # ============================================================

          path = "fs/open.c"
          text = read_file(path)

          faccess_decl = r'''#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(
          		int *dfd,
          		const char __user **filename_user,
          		int *mode,
          		int *flags);
          #endif

          '''

          if "extern int ksu_handle_faccessat(" not in text:

              marker = "SYSCALL_DEFINE3(faccessat,"

              pos = text.find(marker)

              if pos < 0:
                  fail("Could not locate faccessat()")

              text = text[:pos] + faccess_decl + text[pos:]

              write_file(path, text)

              text = read_file(path)

          if "ksu_handle_faccessat(&dfd, &filename, &mode, NULL);" not in text:

              start, open_brace, close_brace = find_function(
                  text,
                  "SYSCALL_DEFINE3(faccessat,"
              )

              function = text[start:close_brace + 1]

              hook = r'''{
          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          '''

              # Replace only the opening brace.
              function = hook + function[function.find("{") + 1:]

              text = (
                  text[:start]
                  + function
                  + text[close_brace + 1:]
              )

              write_file(path, text)

              print("[PASS] faccessat() patched")

          else:
              print("[SKIP] faccessat() already patched")

          # ============================================================
          # kernel/reboot.c
          # ============================================================

          path = "kernel/reboot.c"
          text = read_file(path)

          reboot_decl = r'''#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(
          		int magic1,
          		int magic2,
          		unsigned int cmd,
          		void __user **arg);
          #endif

          '''

          if "extern int ksu_handle_sys_reboot(" not in text:

              marker = "SYSCALL_DEFINE4(reboot,"

              pos = text.find(marker)

              if pos < 0:
                  fail("Could not locate sys_reboot()")

              text = text[:pos] + reboot_decl + text[pos:]

              write_file(path, text)

              text = read_file(path)

          if "ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);" not in text:

              start, open_brace, close_brace = find_function(
                  text,
                  "SYSCALL_DEFINE4(reboot,"
              )

              function = text[start:close_brace + 1]

              match = re.search(
                  r'^[ \t]*int ret\s*=\s*0;\s*$',
                  function,
                  re.MULTILINE
              )

              if not match:
                  fail(
                      "Could not locate 'int ret = 0;' "
                      "inside sys_reboot()"
                  )

              insert_pos = match.end()

              hook = r'''

          #ifdef CONFIG_KSU_MANUAL_HOOK
          	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif'''

              function = (
                  function[:insert_pos]
                  + hook
                  + function[insert_pos:]
              )

              text = (
                  text[:start]
                  + function
                  + text[close_brace + 1:]
              )

              write_file(path, text)

              print("[PASS] sys_reboot() patched")

          else:
              print("[SKIP] sys_reboot() already patched")

          # ============================================================
          # fs/read_write.c - read
          # ============================================================

          path = "fs/read_write.c"
          text = read_file(path)

          read_decl = r'''#ifdef CONFIG_KSU_MANUAL_HOOK
          extern bool ksu_init_rc_hook __read_mostly;
          extern __attribute__((cold)) int ksu_handle_sys_read(
          		unsigned int fd,
          		char __user **buf_ptr,
          		size_t *count_ptr);
          #endif

          '''

          if "extern __attribute__((cold)) int ksu_handle_sys_read(" not in text:

              marker = "SYSCALL_DEFINE3(read,"

              pos = text.find(marker)

              if pos < 0:
                  fail("Could not locate read()")

              text = text[:pos] + read_decl + text[pos:]

              write_file(path, text)

              text = read_file(path)

          if "ksu_handle_sys_read(fd, &buf, &count);" not in text:

              start, open_brace, close_brace = find_function(
                  text,
                  "SYSCALL_DEFINE3(read,"
              )

              function = text[start:close_brace + 1]

              return_match = re.search(
                  r'^[ \t]*return\s+ksys_read\(\s*fd,\s*buf,\s*count\s*\);\s*$',
                  function,
                  re.MULTILINE
              )

              if not return_match:
                  fail(
                      "Could not locate "
                      "'return ksys_read(fd, buf, count);' in read()"
                  )

              hook = r'''#ifdef CONFIG_KSU_MANUAL_HOOK
          	if (unlikely(ksu_init_rc_hook))
          		ksu_handle_sys_read(fd, &buf, &count);
          #endif

          '''

              insert_pos = return_match.start()

              function = (
                  function[:insert_pos]
                  + hook
                  + function[insert_pos:]
              )

              text = (
                  text[:start]
                  + function
                  + text[close_brace + 1:]
              )

              write_file(path, text)

              print("[PASS] read() patched")

          else:
              print("[SKIP] read() already patched")

          # ============================================================
          # FINAL VERIFICATION
          # ============================================================

          checks = {
              "fs/exec.c": [
                  "ksu_handle_execveat(",
                  "ksu_handle_post_execveat(",
              ],

              "fs/stat.c": [
                  "ksu_handle_stat(",
                  "ksu_handle_newfstat_ret(",
                  "ksu_handle_fstat64_ret(",
              ],

              "fs/open.c": [
                  "ksu_handle_faccessat(",
              ],

              "kernel/reboot.c": [
                  "ksu_handle_sys_reboot(",
              ],

              "fs/read_write.c": [
                  "ksu_handle_sys_read(",
              ],
          }

          print()
          print("========================================")
          print("RESUKISU MANUAL HOOK VERIFICATION")
          print("========================================")

          for path, symbols in checks.items():

              text = read_file(path)

              for symbol in symbols:

                  if symbol not in text:
                      fail(
                          f"Missing {symbol} from {path}"
                      )

                  print(
                      f"[PASS] {path}: {symbol}"
                  )

          print()
          print("========================================")
          print("[PASS] ALL RESUKISU MANUAL HOOKS APPLIED")
          print("========================================")
          PY

      # ============================================================
      # VERIFY MANUAL HOOKS
      # ============================================================
      - name: Verify ReSukiSU manual hooks
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          echo "===== EXECVE ====="

          grep -n \
            'ksu_handle_execveat' \
            fs/exec.c

          grep -n \
            'ksu_handle_post_execveat' \
            fs/exec.c

          echo
          echo "===== STAT ====="

          grep -n \
            'ksu_handle_stat' \
            fs/stat.c

          grep -n \
            'ksu_handle_newfstat_ret' \
            fs/stat.c

          grep -n \
            'ksu_handle_fstat64_ret' \
            fs/stat.c

          echo
          echo "===== FACCESSAT ====="

          grep -n \
            'ksu_handle_faccessat' \
            fs/open.c

          echo
          echo "===== REBOOT ====="

          grep -n \
            'ksu_handle_sys_reboot' \
            kernel/reboot.c

          echo
          echo "===== READ ====="

          grep -n \
            'ksu_handle_sys_read' \
            fs/read_write.c

          echo
          echo "[PASS] Required manual-hook symbols present"

      # ============================================================
      # CONFIGURATION
      #
      # Successful vanilla configuration pipeline:
      #
      #   bengal-perf_defconfig
      #          ↓
      #   merge gta4l-common.config
      #          ↓
      #   merge resukisu.config
      #          ↓
      #   olddefconfig
      #
      # CONFIG_COMPAT remains enabled.
      # CONFIG_COMPAT_VDSO is explicitly disabled.
      # CONFIG_VDSO32 is explicitly disabled.
      # ============================================================
      - name: Configure GTA4L + ReSukiSU
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/toolchain/clang-r416183b/bin"
          export PATH="${CLANG_PREBUILT_BIN}:${PATH}"

          # Do NOT configure an ARM32 cross compiler.
          unset CROSS_COMPILE_ARM32 || true

          rm -rf out
          mkdir -p out

          echo
          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          command -v clang
          clang --version

          command -v ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "BASE DEFCONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          echo
          echo "========================================"
          echo "MERGE GTA4L CONFIG"
          echo "========================================"

          KCONFIG_CONFIG="${PWD}/out/.config" \
            ./scripts/kconfig/merge_config.sh \
              -m \
              -r \
              -O out \
              out/.config \
              arch/arm64/configs/vendor/gta4l-common.config

          echo
          echo "========================================"
          echo "CREATE RESUKISU CONFIG"
          echo "========================================"

          cat > out/resukisu.config <<'EOF'

          # ReSukiSU
          CONFIG_KSU=y
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          CONFIG_KSU_MANUAL_HOOK=y

          # Keep 32-bit userspace compatibility.
          CONFIG_COMPAT=y

          # Disable the 32-bit compat vDSO.
          # This is separate from CONFIG_COMPAT.
          # CONFIG_COMPAT_VDSO is not set
          # CONFIG_VDSO32 is not set

          EOF

          echo
          echo "===== RESUKISU CONFIG ====="

          cat out/resukisu.config

          echo
          echo "========================================"
          echo "MERGE RESUKISU CONFIG"
          echo "========================================"

          KCONFIG_CONFIG="${PWD}/out/.config" \
            ./scripts/kconfig/merge_config.sh \
              -m \
              -r \
              -O out \
              out/.config \
              out/resukisu.config

          echo
          echo "========================================"
          echo "OLDDEFCONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "========================================"
          echo "FINAL CONFIG SETTINGS"
          echo "========================================"

          grep -E \
            '^(CONFIG_COMPAT|CONFIG_COMPAT_VDSO|CONFIG_VDSO32|CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK)=' \
            out/.config \
            || true

          grep -E \
            '^# CONFIG_(COMPAT_VDSO|VDSO32|KSU_TRACEPOINT_HOOK) is not set' \
            out/.config \
            || true

          echo
          echo "========================================"
          echo "VERIFY CRITICAL CONFIG"
          echo "========================================"

          grep -q '^CONFIG_COMPAT=y$' out/.config
          grep -q '^CONFIG_MODULES=y$' out/.config
          grep -q '^CONFIG_LTO_CLANG=y$' out/.config
          grep -q '^CONFIG_CFI_CLANG=y$' out/.config
          grep -q '^CONFIG_SHADOW_CALL_STACK=y$' out/.config

          grep -q '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y$' out/.config
          grep -q '^CONFIG_GTA4L_DTB=y$' out/.config

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config; then
            echo "[FAIL] Tracepoint hook is enabled"
            exit 1
          fi

          if grep -q '^CONFIG_COMPAT_VDSO=y$' out/.config; then
            echo "[FAIL] CONFIG_COMPAT_VDSO=y"
            exit 1
          fi

          if grep -q '^CONFIG_VDSO32=y$' out/.config; then
            echo "[FAIL] CONFIG_VDSO32=y"
            exit 1
          fi

          echo
          echo "[PASS] CONFIG_COMPAT=y"
          echo "[PASS] CONFIG_KSU=y"
          echo "[PASS] CONFIG_KSU_MANUAL_HOOK=y"
          echo "[PASS] CONFIG_COMPAT_VDSO disabled"
          echo "[PASS] CONFIG_VDSO32 disabled"

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build ReSukiSU kernel
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/toolchain/clang-r416183b/bin"
          export PATH="${CLANG_PREBUILT_BIN}:${PATH}"

          unset CROSS_COMPILE_ARM32 || true

          echo
          echo "========================================"
          echo "COMPILER"
          echo "========================================"

          command -v clang
          clang --version

          command -v ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "BUILD"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image \
            Image.gz

      # ============================================================
      # VERIFY OUTPUT
      # ============================================================
      - name: Verify kernel artifacts
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          echo
          echo "========================================"
          echo "BOOT OUTPUT"
          echo "========================================"

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          echo
          echo "========================================"
          echo "REQUIRED FILES"
          echo "========================================"

          test -f out/arch/arm64/boot/Image
          test -f out/arch/arm64/boot/Image.gz
          test -f out/vmlinux
          test -f out/System.map
          test -f out/.config

          echo "[PASS] Image"
          echo "[PASS] Image.gz"
          echo "[PASS] vmlinux"
          echo "[PASS] System.map"
          echo "[PASS] .config"

          echo
          echo "===== IMAGE ====="

          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

          echo
          echo "===== IMAGE.GZ ====="

          file out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== VMLINUX ====="

          file out/vmlinux
          ls -lh out/vmlinux

          echo
          echo "===== SYSTEM MAP ====="

          ls -lh out/System.map

          echo
          echo "===== CONFIG HASH ====="

          sha256sum out/.config

          echo
          echo "===== IMAGE HASH ====="

          sha256sum out/arch/arm64/boot/Image

          echo
          echo "===== IMAGE.GZ HASH ====="

          sha256sum out/arch/arm64/boot/Image.gz

          echo
          echo "===== IMAGE HEADER ====="

          xxd -l 16 \
            out/arch/arm64/boot/Image

          echo
          echo "===== GZIP HEADER ====="

          xxd -l 16 \
            out/arch/arm64/boot/Image.gz

      # ============================================================
      # PREPARE ARTIFACTS
      # ============================================================
      - name: Prepare artifacts
        run: |
          set -eux

          mkdir -p artifacts

          cp \
            kernel/samsung/sm6115/out/arch/arm64/boot/Image \
            artifacts/Image

          cp \
            kernel/samsung/sm6115/out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          cp \
            kernel/samsung/sm6115/out/.config \
            artifacts/gta4l-resukisu.config

          cp \
            kernel/samsung/sm6115/out/System.map \
            artifacts/System.map

          cp \
            kernel/samsung/sm6115/out/vmlinux \
            artifacts/vmlinux

          cp \
            kernel/samsung/sm6115/arch/arm64/configs/vendor/bengal-perf_defconfig \
            artifacts/bengal-perf_defconfig

          cp \
            kernel/samsung/sm6115/arch/arm64/configs/vendor/gta4l-common.config \
            artifacts/gta4l-common.config

          cp \
            kernel/samsung/sm6115/out/resukisu.config \
            artifacts/resukisu.config

          echo
          echo "========================================"
          echo "ARTIFACTS"
          echo "========================================"

          ls -lh artifacts/

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload ReSukiSU kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-resukisu-kernel
          path: artifacts/
          if-no-files-found: error
          compression-level: 0aa
