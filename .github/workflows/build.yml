name: Build vanilla SM6115 kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout kernel source
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_samsung_sm6115
          ref: lineage-23.2
          fetch-depth: 1


      # ============================================================
      # 2. Install dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-arm-linux-gnueabihf \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            wget \
            xz-utils


      # ============================================================
      # 3. Display kernel information
      # ============================================================

      - name: Show kernel information
        run: |
          set -e

          echo "========================================"
          echo "Kernel source"
          echo "========================================"

          head -n 30 Makefile

          echo
          echo "========================================"
          echo "ARM64 directory"
          echo "========================================"

          ls -la arch/arm64/

          echo
          echo "========================================"
          echo "Possible GTA4L / SM6115 defconfigs"
          echo "========================================"

          find arch/arm64/configs \
            -type f \
            \( \
              -iname '*gta4l*' \
              -o \
              -iname '*sm6115*' \
            \) \
            -print \
            | sort

          echo
          echo "========================================"
          echo "32-bit vDSO Makefile"
          echo "========================================"

          sed -n '1,180p' arch/arm64/kernel/vdso32/Makefile


      # ============================================================
      # 4. Find GTA4L defconfig
      # ============================================================

      - name: Find device defconfig
        id: defconfig
        shell: bash
        run: |
          set -e

          DEFCONFIG="$(
            find arch/arm64/configs \
              -type f \
              \( \
                -iname '*gta4l*defconfig' \
                -o \
                -iname '*gta4l*config' \
              \) \
              | sort \
              | head -n 1
          )"

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::Could not automatically find a GTA4L defconfig."

            echo
            echo "Available ARM64 defconfigs:"
            find arch/arm64/configs \
              -type f \
              | sort

            exit 1
          fi

          DEFCONFIG="${DEFCONFIG#arch/arm64/configs/}"

          echo "Selected defconfig:"
          echo "$DEFCONFIG"

          echo "name=$DEFCONFIG" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. Download LLVM 12
      # ============================================================

      - name: Download LLVM toolchain
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            --show-progress \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.1/clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz" \
            -O /tmp/clang.tar.xz

          tar -xf /tmp/clang.tar.xz \
            -C "$GITHUB_WORKSPACE/toolchain" \
            --strip-components=1

          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

          echo
          echo "========================================"
          echo "Clang version"
          echo "========================================"

          "$GITHUB_WORKSPACE/toolchain/bin/clang" \
            --version

          echo
          echo "========================================"
          echo "LLD version"
          echo "========================================"

          "$GITHUB_WORKSPACE/toolchain/bin/ld.lld" \
            --version


      # ============================================================
      # 6. Verify ARM32 GCC
      # ============================================================

      - name: Verify ARM32 compatibility compiler
        run: |
          set -e

          echo "========================================"
          echo "ARM32 GCC"
          echo "========================================"

          arm-linux-gnueabihf-gcc --version

          echo
          echo "========================================"
          echo "ARM32 target"
          echo "========================================"

          arm-linux-gnueabihf-gcc -dumpmachine

          echo
          echo "========================================"
          echo "ARM32 tools"
          echo "========================================"

          command -v arm-linux-gnueabihf-gcc
          command -v arm-linux-gnueabihf-ld
          command -v arm-linux-gnueabihf-objcopy
          command -v arm-linux-gnueabihf-elfedit


      # ============================================================
      # 7. Prepare output directory
      # ============================================================

      - name: Prepare build directory
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/out"

          mkdir -p "$GITHUB_WORKSPACE/out"


      # ============================================================
      # 8. Configure kernel
      # ============================================================

      - name: Configure kernel
        env:
          DEFCONFIG: ${{ steps.defconfig.outputs.name }}
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          echo "========================================"
          echo "Configuring kernel"
          echo "========================================"

          echo "Defconfig: $DEFCONFIG"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- \
            "$DEFCONFIG"


      # ============================================================
      # 9. Display important configuration
      # ============================================================

      - name: Show kernel configuration
        run: |
          set -e

          echo "========================================"
          echo "Important configuration"
          echo "========================================"

          grep -E \
            'CONFIG_(ARM64|ARM64_VA_BITS|SMP|MODULES|COMPAT|COMPAT_VDSO|KPROBES|KPROBE_EVENTS|CC_IS_CLANG|LD_IS_LLD)' \
            out/.config \
            || true

          echo
          echo "========================================"
          echo "Kernel version"
          echo "========================================"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- \
            kernelversion


      # ============================================================
      # 10. Verify ARM32 GCC can compile
      # ============================================================

      - name: Test ARM32 GCC
        run: |
          set -e

          echo "========================================"
          echo "Testing ARM32 GCC"
          echo "========================================"

          arm-linux-gnueabihf-gcc \
            -march=armv8-a \
            -mfloat-abi=soft \
            -mabi=aapcs-linux \
            -c \
            -x c \
            /dev/null \
            -o /tmp/arm32-gcc-test.o

          file /tmp/arm32-gcc-test.o

          echo
          echo "ARM32 GCC test succeeded."


      # ============================================================
      # 11. Build kernel
      #
      # CC_COMPAT and LD_COMPAT are explicitly supplied here.
      #
      # This is important because this kernel tree's vdso32
      # Makefile uses CC_COMPAT for the 32-bit compatibility vDSO.
      # ============================================================

      - name: Build kernel
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          echo "========================================"
          echo "Starting kernel build"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- \
            CC_COMPAT=arm-linux-gnueabihf-gcc \
            LD_COMPAT=arm-linux-gnueabihf-ld


      # ============================================================
      # 12. Locate kernel image
      # ============================================================

      - name: Locate kernel image
        run: |
          set -e

          echo "========================================"
          echo "ARM64 boot output"
          echo "========================================"

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort

          echo
          echo "========================================"
          echo "Searching for kernel image"
          echo "========================================"

          found=0

          for image in \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.lz4 \
            out/arch/arm64/boot/Image.lz4-dtb
          do
            if [ -f "$image" ]; then
              echo "FOUND: $image"
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No usable ARM64 kernel image was produced."
            exit 1
          fi


      # ============================================================
      # 13. Collect artifacts
      # ============================================================

      - name: Collect build artifacts
        run: |
          set -e

          rm -rf artifacts

          mkdir -p artifacts

          echo "========================================"
          echo "Copying kernel configuration"
          echo "========================================"

          cp -v \
            out/.config \
            artifacts/kernel.config

          echo
          echo "========================================"
          echo "Copying kernel images"
          echo "========================================"

          for image in \
            Image.gz-dtb \
            Image.gz \
            Image \
            Image.lz4 \
            Image.lz4-dtb
          do
            if [ -f "out/arch/arm64/boot/$image" ]; then
              cp -v \
                "out/arch/arm64/boot/$image" \
                "artifacts/$image"
            fi
          done

          echo
          echo "========================================"
          echo "Copying DTBs"
          echo "========================================"

          if [ -d out/arch/arm64/boot/dts ]; then

            find out/arch/arm64/boot/dts \
              -type f \
              \( \
                -name '*.dtb' \
                -o \
                -name '*.dtbo' \
              \) \
              -print \
              | sort

            find out/arch/arm64/boot/dts \
              -type f \
              \( \
                -name '*.dtb' \
                -o \
                -name '*.dtbo' \
              \) \
              -exec cp --parents {} artifacts/ \;

          fi

          echo
          echo "========================================"
          echo "Artifact contents"
          echo "========================================"

          find artifacts \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort


      # ============================================================
      # 14. Upload artifacts
      # ============================================================

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-vanilla-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
