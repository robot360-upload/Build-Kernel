name: Build KernelSU-Next SM6115 Kernel - GTA4L

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: KernelSU-Next LineageOS SM6115 / GTA4L
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # LINEAGEOS SM6115 KERNEL
      # ============================================================
      - name: Clone LineageOS SM6115 kernel
        run: |
          set -eux

          mkdir -p kernel/samsung

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_samsung_sm6115.git \
            kernel/samsung/sm6115

          cd kernel/samsung/sm6115

          echo "===== KERNEL REVISION ====="
          git rev-parse HEAD

          echo
          echo "===== KERNEL VERSION ====="
          make kernelversion

      # ============================================================
      # EXACT LINEAGEOS CLANG r416183b
      # ============================================================
      - name: Clone LineageOS Clang r416183b
        run: |
          set -eux

          mkdir -p toolchain

          git clone \
            --depth=1 \
            --branch lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            toolchain/clang-r416183b

          echo
          echo "===== CLANG VERSION ====="

          toolchain/clang-r416183b/bin/clang --version

          echo
          echo "===== LLD VERSION ====="

          toolchain/clang-r416183b/bin/ld.lld --version

      # ============================================================
      # KERNELSU-NEXT INTEGRATION
      #
      # KernelSU-Next setup.sh:
      #
      #   1. Clones KernelSU-Next
      #   2. Checks out the requested revision
      #   3. Creates drivers/kernelsu symlink
      #   4. Adds kernelsu/ to drivers/Makefile
      #   5. Adds drivers/kernelsu/Kconfig to drivers/Kconfig
      #
      # We pin the exact commit for reproducible builds.
      # ============================================================
      - name: Integrate KernelSU-Next
        working-directory: kernel/samsung/sm6115
        env:
          KSU_NEXT_COMMIT: c61d876480976e553060789759cc4b54c9e7d816
        run: |
          set -eux

          echo "===== KERNELSU-NEXT COMMIT ====="
          echo "${KSU_NEXT_COMMIT}"

          echo
          echo "===== DOWNLOAD PINNED SETUP SCRIPT ====="

          curl \
            --fail \
            --location \
            --proto '=https' \
            -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_NEXT_COMMIT}/kernel/setup.sh" \
            -o /tmp/ksun-setup.sh

          chmod +x /tmp/ksun-setup.sh

          echo
          echo "===== SETUP SCRIPT HELP ====="

          /tmp/ksun-setup.sh --help

          echo
          echo "===== RUN KERNELSU-NEXT SETUP ====="

          /tmp/ksun-setup.sh "${KSU_NEXT_COMMIT}"

          echo
          echo "===== VERIFY KERNELSU-NEXT TREE ====="

          test -d KernelSU-Next
          test -d KernelSU-Next/kernel

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo
          echo "===== KERNELSU-NEXT SYMLINK ====="

          readlink drivers/kernelsu

          echo
          echo "===== VERIFY KERNEL MAKEFILE HOOK ====="

          grep -n \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          echo
          echo "===== VERIFY KERNEL KCONFIG HOOK ====="

          grep -n \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          echo
          echo "===== VERIFY KERNELSU-NEXT REVISION ====="

          test \
            "$(git -C KernelSU-Next rev-parse HEAD)" \
            = \
            "${KSU_NEXT_COMMIT}"

          git -C KernelSU-Next rev-parse HEAD

          echo
          echo "===== KERNELSU-NEXT INTEGRATION COMPLETE ====="

      # ============================================================
      # CONFIGURATION
      # ============================================================
      - name: Configure GTA4L kernel
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/toolchain/clang-r416183b/bin"
          export PATH="${CLANG_PREBUILT_BIN}:${PATH}"

          rm -rf out
          mkdir -p out

          echo "===== TOOLCHAIN CHECK ====="

          command -v clang
          clang --version

          command -v ld.lld
          ld.lld --version

          echo
          echo "===== VERIFY CONFIG FILES ====="

          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f arch/arm64/configs/vendor/gta4l-common.config

          echo "bengal-perf_defconfig: OK"
          echo "gta4l-common.config:   OK"

          echo
          echo "===== CREATE BASE CONFIG ====="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          echo
          echo "===== MERGE GTA4L FRAGMENT ====="

          KCONFIG_CONFIG="${PWD}/out/.config" \
            ./scripts/kconfig/merge_config.sh \
              -m \
              -r \
              -O out \
              out/.config \
              arch/arm64/configs/vendor/gta4l-common.config

          echo
          echo "===== ADD KERNELSU-NEXT CONFIGURATION ====="

          cat > out/kernelsu-next.config <<'EOF'
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU=y
          EOF

          cat out/kernelsu-next.config

          echo
          echo "===== MERGE KERNELSU-NEXT CONFIGURATION ====="

          KCONFIG_CONFIG="${PWD}/out/.config" \
            ./scripts/kconfig/merge_config.sh \
              -m \
              -r \
              -O out \
              out/.config \
              out/kernelsu-next.config

          echo
          echo "===== FINALIZE CONFIG ====="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "===== VERIFY CRITICAL OPTIONS ====="

          test "$(grep -c '^CONFIG_COMPAT=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_MODULES=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_LTO_CLANG=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_CFI_CLANG=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_SHADOW_CALL_STACK=y$' out/.config)" -eq 1

          test "$(grep -c '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_GTA4L_DTB=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_KERNEL_GZIP=y$' out/.config)" -eq 1

          echo
          echo "===== VERIFY KERNELSU-NEXT OPTIONS ====="

          test "$(grep -c '^CONFIG_KPROBES=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_HAVE_KPROBES=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_KPROBE_EVENTS=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_KSU=y$' out/.config)" -eq 1
          test "$(grep -c '^CONFIG_EXT4_FS=y$' out/.config)" -eq 1

          echo
          echo "===== VERIFIED CONFIG ====="

          grep -E \
            '^(CONFIG_COMPAT|CONFIG_MODULES|CONFIG_LTO_CLANG|CONFIG_CFI_CLANG|CONFIG_SHADOW_CALL_STACK|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|CONFIG_GTA4L_DTB|CONFIG_KERNEL_GZIP|CONFIG_KPROBES|CONFIG_HAVE_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU|CONFIG_EXT4_FS)=' \
            out/.config

          echo
          echo "===== CONFIG COMPLETE ====="

      # ============================================================
      # BUILD
      #
      # Build BOTH:
      #
      #   Image     = raw ARM64 kernel
      #   Image.gz  = gzip compressed kernel
      #
      # Your working T505 boot image contains a raw ARM64 kernel
      # when extracted with Magiskboot, so Image is the important
      # output for repacking.
      # ============================================================
      - name: Build KernelSU-Next kernel
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export CLANG_PREBUILT_BIN="${GITHUB_WORKSPACE}/toolchain/clang-r416183b/bin"
          export PATH="${CLANG_PREBUILT_BIN}:${PATH}"

          echo "===== FINAL COMPILER ====="

          command -v clang
          clang --version

          echo
          echo "===== FINAL KERNELSU CONFIG ====="

          grep '^CONFIG_KSU=' out/.config
          grep '^CONFIG_KPROBES=' out/.config
          grep '^CONFIG_KPROBE_EVENTS=' out/.config

          echo
          echo "===== BUILD RAW IMAGE + COMPRESSED IMAGE ====="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image Image.gz

      # ============================================================
      # VERIFY OUTPUT
      # ============================================================
      - name: Verify KernelSU-Next kernel artifacts
        working-directory: kernel/samsung/sm6115
        run: |
          set -eux

          echo "===== BOOT DIRECTORY ====="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          echo
          echo "===== REQUIRED FILES ====="

          test -f out/arch/arm64/boot/Image
          test -f out/arch/arm64/boot/Image.gz
          test -f out/vmlinux
          test -f out/System.map
          test -f out/.config

          echo
          echo "===== RAW IMAGE ====="

          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

          echo
          echo "===== COMPRESSED IMAGE ====="

          file out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== VMLINUX ====="

          ls -lh out/vmlinux

          echo
          echo "===== SYSTEM MAP ====="

          ls -lh out/System.map

          echo
          echo "===== KERNELSU CONFIG ====="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_HAVE_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_EXT4_FS)=' \
            out/.config

          echo
          echo "===== FINAL CONFIG HASH ====="

          sha256sum out/.config

          echo
          echo "===== RAW KERNEL HASH ====="

          sha256sum out/arch/arm64/boot/Image

          echo
          echo "===== COMPRESSED KERNEL HASH ====="

          sha256sum out/arch/arm64/boot/Image.gz

          echo
          echo "===== RAW IMAGE HEADER ====="

          xxd -l 16 out/arch/arm64/boot/Image

          echo
          echo "===== GZIP HEADER ====="

          xxd -l 16 out/arch/arm64/boot/Image.gz

      # ============================================================
      # PACKAGE ARTIFACTS
      # ============================================================
      - name: Prepare artifacts
        run: |
          set -eux

          mkdir -p artifacts

          cp \
            kernel/samsung/sm6115/out/arch/arm64/boot/Image \
            artifacts/Image

          cp \
            kernel/samsung/sm6115/out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          cp \
            kernel/samsung/sm6115/out/.config \
            artifacts/gta4l-kernelsu-next.config

          cp \
            kernel/samsung/sm6115/out/System.map \
            artifacts/System.map

          cp \
            kernel/samsung/sm6115/out/vmlinux \
            artifacts/vmlinux

          cp \
            kernel/samsung/sm6115/arch/arm64/configs/vendor/bengal-perf_defconfig \
            artifacts/bengal-perf_defconfig

          cp \
            kernel/samsung/sm6115/arch/arm64/configs/vendor/gta4l-common.config \
            artifacts/gta4l-common.config

          cp \
            kernel/samsung/sm6115/out/kernelsu-next.config \
            artifacts/kernelsu-next.config

          echo
          echo "===== KERNELSU-NEXT REVISION ====="

          git \
            -C kernel/samsung/sm6115/KernelSU-Next \
            rev-parse HEAD \
            > artifacts/kernelsu-next.commit

          echo
          echo "===== ARTIFACTS ====="

          ls -lh artifacts/

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload KernelSU-Next kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-kernelsu-next-kernel
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
