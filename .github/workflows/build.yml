name: Build ReSukiSU - Galaxy Tab A7 SM-T505

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      KERNEL_REPO: LineageOS/android_kernel_samsung_sm6115
      KERNEL_BRANCH: lineage-23.2

      CLANG_REPO: LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b
      CLANG_BRANCH: lineage-20.0

      KERNEL_DIR: ${{ github.workspace }}/kernel
      CLANG_DIR: ${{ github.workspace }}/clang-r416183b
      OUT_DIR: ${{ github.workspace }}/out

    steps:

      # ============================================================
      # Dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gawk \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            rsync \
            unzip \
            zip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ============================================================
      # Clone LineageOS kernel
      # ============================================================

      - name: Clone LineageOS SM6115 kernel
        run: |
          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "https://github.com/${KERNEL_REPO}.git" \
            "${KERNEL_DIR}"

          cd "${KERNEL_DIR}"

          echo "========================================"
          echo "Kernel repository"
          echo "========================================"

          git remote -v
          git branch --show-current
          git rev-parse HEAD

      # ============================================================
      # Clone the clang version used by the known-good build
      # ============================================================

      - name: Clone clang-r416183b
        run: |
          git clone \
            --depth=1 \
            --single-branch \
            --branch "${CLANG_BRANCH}" \
            "https://github.com/${CLANG_REPO}.git" \
            "${CLANG_DIR}"

          echo "========================================"
          echo "Clang"
          echo "========================================"

          "${CLANG_DIR}/bin/clang" --version

      # ============================================================
      # Verify the source tree before modifying it
      # ============================================================

      - name: Verify LineageOS kernel tree
        working-directory: kernel
        run: |
          set -e

          test -f fs/stat.c
          test -f fs/exec.c
          test -f fs/open.c
          test -f fs/read_write.c
          test -f kernel/reboot.c

          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f arch/arm64/configs/vendor/gta4l-common.config

          echo "[PASS] Expected kernel files exist"

          echo
          echo "===== Kernel version ====="
          make kernelversion

          echo
          echo "===== Relevant functions ====="

          grep -n \
            'SYSCALL_DEFINE4(newfstatat\|SYSCALL_DEFINE2(newfstat\|SYSCALL_DEFINE2(fstat64\|SYSCALL_DEFINE4(fstatat64' \
            fs/stat.c

          grep -n \
            'do_execveat_common\|compat_do_execve' \
            fs/exec.c

          grep -n \
            'SYSCALL_DEFINE3(faccessat)' \
            fs/open.c

          grep -n \
            'SYSCALL_DEFINE3(read)' \
            fs/read_write.c

          grep -n \
            'SYSCALL_DEFINE4(reboot)' \
            kernel/reboot.c

      # ============================================================
      # Install ReSukiSU into the kernel
      # ============================================================

      - name: Setup ReSukiSU
        working-directory: kernel
        run: |
          set -e

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            -o /tmp/resukisu-setup.sh

          chmod +x /tmp/resukisu-setup.sh

          /tmp/resukisu-setup.sh

          echo
          echo "========================================"
          echo "Verifying ReSukiSU installation"
          echo "========================================"

          test -d KernelSU
          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          echo "[PASS] KernelSU directory exists"
          echo "[PASS] drivers/kernelsu exists"
          echo "[PASS] KernelSU Kconfig exists"

          echo
          ls -ld KernelSU drivers/kernelsu

      # ============================================================
      # Enable ReSukiSU
      # ============================================================

      - name: Add ReSukiSU configuration
        working-directory: kernel
        run: |
          set -e

          CONFIG="arch/arm64/configs/vendor/gta4l-common.config"

          grep -qxF 'CONFIG_KSU=y' "$CONFIG" || \
            echo 'CONFIG_KSU=y' >> "$CONFIG"

          grep -qxF 'CONFIG_KSU_MANUAL_HOOK=y' "$CONFIG" || \
            echo 'CONFIG_KSU_MANUAL_HOOK=y' >> "$CONFIG"

          echo "========================================"
          echo "ReSukiSU configuration"
          echo "========================================"

          grep '^CONFIG_KSU' "$CONFIG"

      # ============================================================
      # Apply the exact ReSukiSU 4.19 manual hooks
      #
      # IMPORTANT:
      # We do not match giant whitespace-sensitive source blocks.
      # Instead we locate the actual function declarations in the
      # LineageOS tree and modify their bodies.
      # ============================================================

      - name: Apply ReSukiSU manual hooks
        working-directory: kernel
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def fail(message):
              raise SystemExit("[FAIL] " + message)

          def insert_before_function_body(text, signature_regex, insertion, name):
              """
              Find a function signature and insert text immediately after
              its opening '{'.

              This deliberately ignores whitespace differences.
              """

              match = re.search(
                  signature_regex + r'\s*\{',
                  text,
                  re.MULTILINE
              )

              if not match:
                  fail(f"{name}: function signature not found")

              brace = text.find("{", match.start(), match.end())

              if brace == -1:
                  fail(f"{name}: opening brace not found")

              if insertion.strip() in text:
                  print(f"[OK] {name}: already present")
                  return text

              return text[:brace + 1] + "\n" + insertion + text[brace + 1:]

          def insert_after_marker(text, marker_regex, insertion, name):
              if insertion.strip() in text:
                  print(f"[OK] {name}: already present")
                  return text

              match = re.search(marker_regex, text, re.MULTILINE)

              if not match:
                  fail(f"{name}: anchor not found")

              pos = match.end()

              return text[:pos] + "\n" + insertion + text[pos:]

          # ========================================================
          # fs/stat.c
          # ========================================================

          path = Path("fs/stat.c")
          text = read(path)

          stat_declarations = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(
              int *dfd,
              const char __user **filename_user,
              int *flags);

          extern void ksu_handle_newfstat_ret(
              unsigned int *fd,
              struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
              unsigned long *fd,
              struct stat64 __user **statbuf_ptr);
          #endif
          #endif
          """

          # Put declarations before the first newfstatat syscall.
          if "ksu_handle_stat(" not in text:
              match = re.search(
                  r'^SYSCALL_DEFINE4\(newfstatat,',
                  text,
                  re.MULTILINE
              )

              if not match:
                  fail("stat: newfstatat syscall not found")

              text = (
                  text[:match.start()]
                  + stat_declarations.strip()
                  + "\n\n"
                  + text[match.start():]
              )

              print("[OK] stat declarations inserted")
          else:
              print("[OK] stat declarations already present")

          # newfstatat()
          pattern = (
              r'SYSCALL_DEFINE4\(newfstatat,\s*'
              r'int,\s*dfd,\s*'
              r'const char __user \*,\s*filename,\s*'
              r'struct stat __user \*,\s*statbuf,\s*'
              r'int,\s*flag\)'
          )

          hook = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          """

          if "ksu_handle_stat(&dfd, &filename, &flag)" not in text:
              text = insert_before_function_body(
                  text,
                  pattern,
                  hook,
                  "stat/newfstatat"
              )
              print("[OK] stat/newfstatat hook inserted")

          # newfstat()
          pattern = (
              r'SYSCALL_DEFINE2\(newfstat,\s*'
              r'unsigned int,\s*fd,\s*'
              r'struct stat __user \*,\s*statbuf\)'
          )

          hook = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          """

          if "ksu_handle_newfstat_ret(&fd, &statbuf)" not in text:
              # Insert immediately before the final return of newfstat.
              match = re.search(
                  pattern + r'\s*\{.*?\n\}',
                  text,
                  re.MULTILINE | re.DOTALL
              )

              if not match:
                  fail("stat/newfstat: function not found")

              body = match.group(0)

              return_match = re.search(
                  r'(\n\s*return\s+error;\s*\n)',
                  body
              )

              if not return_match:
                  fail("stat/newfstat: return error anchor not found")

              body = (
                  body[:return_match.start()]
                  + "\n"
                  + hook
                  + body[return_match.start():]
              )

              text = text[:match.start()] + body + text[match.end():]

              print("[OK] stat/newfstat hook inserted")

          # fstat64()
          pattern = (
              r'SYSCALL_DEFINE2\(fstat64,\s*'
              r'unsigned long,\s*fd,\s*'
              r'struct stat64 __user \*,\s*statbuf\)'
          )

          hook = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          """

          if "ksu_handle_fstat64_ret(&fd, &statbuf)" not in text:
              match = re.search(
                  pattern + r'\s*\{.*?\n\}',
                  text,
                  re.MULTILINE | re.DOTALL
              )

              if not match:
                  fail("stat/fstat64: function not found")

              body = match.group(0)

              return_match = re.search(
                  r'(\n\s*return\s+error;\s*\n)',
                  body
              )

              if not return_match:
                  fail("stat/fstat64: return error anchor not found")

              body = (
                  body[:return_match.start()]
                  + "\n"
                  + hook
                  + body[return_match.start():]
              )

              text = text[:match.start()] + body + text[match.end():]

              print("[OK] stat/fstat64 hook inserted")

          # fstatat64()
          pattern = (
              r'SYSCALL_DEFINE4\(fstatat64,\s*'
              r'int,\s*dfd,\s*'
              r'const char __user \*,\s*filename,\s*'
              r'struct stat64 __user \*,\s*statbuf,\s*'
              r'int,\s*flag\)'
          )

          if "ksu_handle_stat(&dfd, &filename, &flag)" not in text:
              # It should already have been added to newfstatat, so use
              # a function-specific regex here.
              match = re.search(
                  pattern + r'\s*\{',
                  text,
                  re.MULTILINE
              )

              if not match:
                  fail("stat/fstatat64: function not found")

              brace = text.find("{", match.start(), match.end())

              text = (
                  text[:brace + 1]
                  + "\n"
                  + hook
                  + text[brace + 1:]
              )

              print("[OK] stat/fstatat64 hook inserted")
          else:
              # If the generic call already exists, determine whether
              # fstatat64 actually contains it.
              match = re.search(
                  pattern + r'\s*\{.*?\n\}',
                  text,
                  re.MULTILINE | re.DOTALL
              )

              if not match:
                  fail("stat/fstatat64: function not found")

              if "ksu_handle_stat(&dfd, &filename, &flag)" not in match.group(0):
                  brace = text.find("{", match.start(), match.end())
                  text = (
                      text[:brace + 1]
                      + "\n"
                      + hook
                      + text[brace + 1:]
                  )

                  print("[OK] stat/fstatat64 hook inserted")

          write(path, text)

          # ========================================================
          # fs/exec.c
          #
          # Current ReSukiSU API:
          #
          # ksu_handle_execveat()
          # ksu_handle_post_execveat()
          #
          # For this 4.19 tree, the primary required hook is
          # do_execveat_common().
          # ========================================================

          path = Path("fs/exec.c")
          text = read(path)

          exec_declarations = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(
              int *fd,
              struct filename **filename_ptr,
              void *argv,
              void *envp,
              int *flags);

          __attribute__((hot))
          extern int ksu_handle_post_execveat(
              int *fd,
              struct filename **filename_ptr,
              void *argv,
              void *envp,
              int *flags,
              int *retval);
          #endif
          """

          if "ksu_handle_execveat(" not in text:
              marker = re.search(
                  r'^static int do_execveat_common\(',
                  text,
                  re.MULTILINE
              )

              if not marker:
                  fail("exec: do_execveat_common not found")

              text = (
                  text[:marker.start()]
                  + exec_declarations.strip()
                  + "\n\n"
                  + text[marker.start():]
              )

              print("[OK] exec declarations inserted")
          else:
              print("[OK] exec declarations already present")

          pattern = (
              r'static int do_execveat_common\('
              r'\s*int fd,\s*'
              r'struct filename \*filename,\s*'
              r'struct user_arg_ptr argv,\s*'
              r'struct user_arg_ptr envp,\s*'
              r'int flags\)'
          )

          if "ksu_handle_post_execveat(" not in text:
              match = re.search(
                  pattern + r'\s*\{.*?\n\}',
                  text,
                  re.MULTILINE | re.DOTALL
              )

              if not match:
                  fail("exec: do_execveat_common body not found")

              body = match.group(0)

              old = (
                  "return __do_execve_file("
                  "fd, filename, argv, envp, flags, NULL);"
              )

              if old not in body:
                  fail(
                      "exec: expected __do_execve_file() "
                      "call not found in do_execveat_common"
                  )

              replacement = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              int retval;

              ksu_handle_execveat(
                  &fd,
                  &filename,
                  &argv,
                  &envp,
                  &flags);

              retval = __do_execve_file(
                  fd,
                  filename,
                  argv,
                  envp,
                  flags,
                  NULL);

              ksu_handle_post_execveat(
                  &fd,
                  &filename,
                  &argv,
                  &envp,
                  &flags,
                  &retval);

              return retval;
          #else
          """ + "\n              " + old + r"""
          #endif"""

              body = body.replace(old, replacement, 1)

              text = (
                  text[:match.start()]
                  + body
                  + text[match.end():]
              )

              print("[OK] exec/do_execveat_common hooks inserted")
          else:
              print("[OK] exec hooks already present")

          # 32-bit compatibility:
          # ReSukiSU's documentation specifically calls out
          # do_execve/compat_do_execve for 32-bit su and 32-on-64.
          #
          # This SM6115 kernel has CONFIG_COMPAT=y.
          # Add the deprecated compatibility hook exactly where
          # supported, but don't modify the primary common hook.

          compat_pattern = (
              r'static int compat_do_execve\('
              r'\s*struct filename \*filename,\s*'
              r'const char __user \*const __user \*__argv,\s*'
              r'const char __user \*const __user \*__envp\)'
          )

          if "ksu_handle_execveat((int *)AT_FDCWD" not in text:
              match = re.search(
                  compat_pattern + r'\s*\{.*?\n\}',
                  text,
                  re.MULTILINE | re.DOTALL
              )

              if match:
                  body = match.group(0)

                  marker = (
                      "return do_execveat_common("
                      "AT_FDCWD, filename, argv, envp, 0);"
                  )

                  if marker in body:
                      replacement = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              int retval;

              ksu_handle_execveat(
                  (int *)AT_FDCWD,
                  &filename,
                  &argv,
                  &envp,
                  0);

              retval = do_execveat_common(
                  AT_FDCWD,
                  filename,
                  argv,
                  envp,
                  0);

              ksu_handle_post_execveat(
                  (int *)AT_FDCWD,
                  &filename,
                  &argv,
                  &envp,
                  0,
                  &retval);

              return retval;
          #else
          """ + "\n              " + marker + r"""
          #endif"""

                      body = body.replace(marker, replacement, 1)

                      text = (
                          text[:match.start()]
                          + body
                          + text[match.end():]
                      )

                      print("[OK] exec/compat_do_execve compatibility hook inserted")
              else:
                  print(
                      "[INFO] compat_do_execve signature differs; "
                      "primary do_execveat_common hook remains active"
                  )

          write(path, text)

          # ========================================================
          # fs/open.c — faccessat
          # ========================================================

          path = Path("fs/open.c")
          text = read(path)

          access_declaration = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(
              int *dfd,
              const char __user **filename_user,
              int *mode,
              int *flags);
          #endif
          """

          if "ksu_handle_faccessat(" not in text:
              marker = re.search(
                  r'^SYSCALL_DEFINE3\(faccessat,',
                  text,
                  re.MULTILINE
              )

              if not marker:
                  fail("open: faccessat syscall not found")

              text = (
                  text[:marker.start()]
                  + access_declaration.strip()
                  + "\n\n"
                  + text[marker.start():]
              )

              print("[OK] faccessat declaration inserted")

          pattern = (
              r'SYSCALL_DEFINE3\(faccessat,\s*'
              r'int,\s*dfd,\s*'
              r'const char __user \*,\s*filename,\s*'
              r'int,\s*mode\)'
          )

          if "ksu_handle_faccessat(&dfd, &filename, &mode, NULL)" not in text:
              text = insert_before_function_body(
                  text,
                  pattern,
                  r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          """,
                  "open/faccessat"
              )

              print("[OK] open/faccessat hook inserted")

          write(path, text)

          # ========================================================
          # fs/read_write.c — read()
          #
          # This is the correct 4.19 hook. Do NOT hook ksys_read().
          # ========================================================

          path = Path("fs/read_write.c")
          text = read(path)

          read_declaration = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern bool ksu_init_rc_hook __read_mostly;

          extern __attribute__((cold)) int ksu_handle_sys_read(
              unsigned int fd,
              char __user **buf_ptr,
              size_t *count_ptr);
          #endif
          """

          if "ksu_handle_sys_read(" not in text:
              marker = re.search(
                  r'^SYSCALL_DEFINE3\(read,',
                  text,
                  re.MULTILINE
              )

              if not marker:
                  fail("read: read syscall not found")

              text = (
                  text[:marker.start()]
                  + read_declaration.strip()
                  + "\n\n"
                  + text[marker.start():]
              )

              print("[OK] read declaration inserted")

          pattern = (
              r'SYSCALL_DEFINE3\(read,\s*'
              r'unsigned int,\s*fd,\s*'
              r'char __user \*,\s*buf,\s*'
              r'size_t,\s*count\)'
          )

          if "ksu_handle_sys_read(fd, &buf, &count)" not in text:
              text = insert_before_function_body(
                  text,
                  pattern,
                  r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              if (unlikely(ksu_init_rc_hook))
                  ksu_handle_sys_read(fd, &buf, &count);
          #endif
          """,
                  "read"
              )

              print("[OK] read hook inserted")

          write(path, text)

          # ========================================================
          # kernel/reboot.c — reboot()
          # ========================================================

          path = Path("kernel/reboot.c")
          text = read(path)

          reboot_declaration = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(
              int magic1,
              int magic2,
              unsigned int cmd,
              void __user **arg);
          #endif
          """

          if "ksu_handle_sys_reboot(" not in text:
              marker = re.search(
                  r'^SYSCALL_DEFINE4\(reboot,',
                  text,
                  re.MULTILINE
              )

              if not marker:
                  fail("reboot: reboot syscall not found")

              text = (
                  text[:marker.start()]
                  + reboot_declaration.strip()
                  + "\n\n"
                  + text[marker.start():]
              )

              print("[OK] reboot declaration inserted")

          pattern = (
              r'SYSCALL_DEFINE4\(reboot,\s*'
              r'int,\s*magic1,\s*'
              r'int,\s*magic2,\s*'
              r'unsigned int,\s*cmd,\s*'
              r'void __user \*,\s*arg\)'
          )

          if "ksu_handle_sys_reboot(magic1, magic2, cmd, &arg)" not in text:
              text = insert_before_function_body(
                  text,
                  pattern,
                  r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif
          """,
                  "reboot"
              )

              print("[OK] reboot hook inserted")

          write(path, text)

          # ========================================================
          # Final source verification
          # ========================================================

          checks = {
              "fs/stat.c": [
                  "ksu_handle_stat(&dfd, &filename, &flag)",
                  "ksu_handle_newfstat_ret(&fd, &statbuf)",
                  "ksu_handle_fstat64_ret(&fd, &statbuf)",
              ],

              "fs/exec.c": [
                  "ksu_handle_execveat(",
                  "ksu_handle_post_execveat(",
              ],

              "fs/open.c": [
                  "ksu_handle_faccessat(&dfd, &filename, &mode, NULL)",
              ],

              "fs/read_write.c": [
                  "ksu_init_rc_hook",
                  "ksu_handle_sys_read(fd, &buf, &count)",
              ],

              "kernel/reboot.c": [
                  "ksu_handle_sys_reboot(magic1, magic2, cmd, &arg)",
              ],
          }

          print()
          print("========================================")
          print("Final hook verification")
          print("========================================")

          for filename, needles in checks.items():
              data = read(filename)

              for needle in needles:
                  if needle not in data:
                      fail(
                          f"verification: {needle!r} "
                          f"missing from {filename}"
                      )

              print(f"[PASS] {filename}")

          print()
          print("[PASS] All required ReSukiSU manual hooks are present.")
          PY

      # ============================================================
      # Show resulting patches
      # ============================================================

      - name: Show ReSukiSU modifications
        working-directory: kernel
        run: |
          echo "========================================"
          echo "ReSukiSU config"
          echo "========================================"

          grep '^CONFIG_KSU' \
            arch/arm64/configs/vendor/gta4l-common.config

          echo
          echo "========================================"
          echo "ReSukiSU hooks"
          echo "========================================"

          grep -R -n \
            -E \
            'ksu_handle_(stat|newfstat_ret|fstat64_ret|execveat|post_execveat|faccessat|sys_read|sys_reboot)' \
            fs/stat.c \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            kernel/reboot.c

      # ============================================================
      # Configure kernel
      # ============================================================

      - name: Configure kernel
        working-directory: kernel
        env:
          PATH: ${{ env.CLANG_DIR }}/bin:${{ env.PATH }}

        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "========================================"
          echo "Compiler"
          echo "========================================"

          clang --version
          ld.lld --version

          echo
          echo "========================================"
          echo "Generating bengal-perf configuration"
          echo "========================================"

          make \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          echo
          echo "========================================"
          echo "Merging GTA4L configuration"
          echo "========================================"

          scripts/kconfig/merge_config.sh \
            -m \
            "${OUT_DIR}/.config" \
            arch/arm64/configs/vendor/gta4l-common.config

          make \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "========================================"
          echo "Final KSU configuration"
          echo "========================================"

          grep '^CONFIG_KSU' "${OUT_DIR}/.config"

          grep -qxF 'CONFIG_KSU=y' \
            "${OUT_DIR}/.config"

          grep -qxF 'CONFIG_KSU_MANUAL_HOOK=y' \
            "${OUT_DIR}/.config"

          echo
          echo "[PASS] CONFIG_KSU=y"
          echo "[PASS] CONFIG_KSU_MANUAL_HOOK=y"

      # ============================================================
      # Build
      # ============================================================

      - name: Build kernel
        working-directory: kernel
        env:
          PATH: ${{ env.CLANG_DIR }}/bin:${{ env.PATH }}

        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "========================================"
          echo "Building Image + Image.gz"
          echo "========================================"

          make \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image \
            Image.gz

      # ============================================================
      # Verify final kernel
      # ============================================================

      - name: Verify kernel
        run: |
          set -e

          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"
          IMAGE_GZ="${OUT_DIR}/arch/arm64/boot/Image.gz"

          test -f "$IMAGE"
          test -f "$IMAGE_GZ"
          test -f "${OUT_DIR}/vmlinux"
          test -f "${OUT_DIR}/System.map"
          test -f "${OUT_DIR}/.config"

          echo "========================================"
          echo "Build successful"
          echo "========================================"

          ls -lh \
            "$IMAGE" \
            "$IMAGE_GZ" \
            "${OUT_DIR}/vmlinux" \
            "${OUT_DIR}/System.map"

          echo
          file "$IMAGE"
          file "$IMAGE_GZ"

      # ============================================================
      # Package
      # ============================================================

      - name: Package kernel
        run: |
          set -e

          mkdir -p kernel-artifact

          cp \
            "${OUT_DIR}/arch/arm64/boot/Image" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/arch/arm64/boot/Image.gz" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/vmlinux" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/System.map" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/.config" \
            kernel-artifact/kernel.config

          cp \
            "${KERNEL_DIR}/arch/arm64/configs/vendor/bengal-perf_defconfig" \
            kernel-artifact/

          cp \
            "${KERNEL_DIR}/arch/arm64/configs/vendor/gta4l-common.config" \
            kernel-artifact/

          cat > kernel-artifact/BUILD_INFO.txt <<EOF
          Device: Samsung Galaxy Tab A7 SM-T505
          Codename: gta4l
          Kernel repository: ${KERNEL_REPO}
          Kernel branch: ${KERNEL_BRANCH}
          Kernel commit: $(cd "${KERNEL_DIR}" && git rev-parse HEAD)
          ReSukiSU: enabled
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          Compiler: clang-r416183b
          EOF

          tar -czf \
            resukisu-sm6115-kernel.tar.gz \
            -C kernel-artifact .

          ls -lh resukisu-sm6115-kernel.tar.gz

      # ============================================================
      # Upload
      # ============================================================

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-sm6115-kernel
          path: resukisu-sm6115-kernel.tar.gz
          if-no-files-found: error
          retention-days: 14
