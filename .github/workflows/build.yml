name: Build vanilla SM6115 kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout kernel source
      # ------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_samsung_sm6115
          ref: lineage-23.2
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Install dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-arm-linux-gnueabihf \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            wget \
            xz-utils

      # ------------------------------------------------------------
      # 3. Inspect kernel source
      # ------------------------------------------------------------
      - name: Show kernel information
        run: |
          set -e

          echo "===== Kernel Makefile ====="
          head -n 30 Makefile

          echo
          echo "===== ARM64 directory ====="
          ls -la arch/arm64/

          echo
          echo "===== Possible device defconfigs ====="
          find arch/arm64/configs -type f \
            \( -iname '*gta4l*' -o -iname '*sm6115*' \) \
            -print | sort || true

          echo
          echo "===== ARM64 32-bit vDSO Makefile ====="
          sed -n '1,240p' arch/arm64/kernel/vdso32/Makefile

      # ------------------------------------------------------------
      # 4. Locate gta4l defconfig
      # ------------------------------------------------------------
      - name: Find device defconfig
        id: defconfig
        shell: bash
        run: |
          set -e

          DEFCONFIG="$(
            find arch/arm64/configs -type f \
              \( \
                -iname '*gta4l*defconfig' \
                -o \
                -iname '*gta4l*config' \
              \) \
              | sort \
              | head -n 1
          )"

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::Could not automatically find a gta4l defconfig."

            echo
            echo "Available defconfigs:"
            find arch/arm64/configs -type f | sort

            exit 1
          fi

          DEFCONFIG="${DEFCONFIG#arch/arm64/configs/}"

          echo "Selected defconfig: $DEFCONFIG"

          echo "name=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 5. Download LLVM/Clang
      # ------------------------------------------------------------
      - name: Download LLVM toolchain
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            --show-progress \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.1/clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz" \
            -O /tmp/clang.tar.xz

          tar -xf /tmp/clang.tar.xz \
            -C "$GITHUB_WORKSPACE/toolchain" \
            --strip-components=1

          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

          echo
          echo "===== Clang ====="
          "$GITHUB_WORKSPACE/toolchain/bin/clang" --version

          echo
          echo "===== LLD ====="
          "$GITHUB_WORKSPACE/toolchain/bin/ld.lld" --version

      # ------------------------------------------------------------
      # 6. Verify 32-bit ARM compatibility toolchain
      # ------------------------------------------------------------
      - name: Verify ARM32 compatibility toolchain
        run: |
          set -e

          echo "===== ARM32 GCC ====="
          arm-linux-gnueabihf-gcc --version

          echo
          echo "===== ARM32 GCC target ====="
          arm-linux-gnueabihf-gcc -dumpmachine

          echo
          echo "===== ARM32 ELF tools ====="
          command -v arm-linux-gnueabihf-gcc
          command -v arm-linux-gnueabihf-ld
          command -v arm-linux-gnueabihf-objcopy
          command -v arm-linux-gnueabihf-elfedit

      # ------------------------------------------------------------
      # 7. Prepare output directory
      # ------------------------------------------------------------
      - name: Prepare build directory
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/out"

          mkdir -p "$GITHUB_WORKSPACE/out"

      # ------------------------------------------------------------
      # 8. Configure kernel
      # ------------------------------------------------------------
      - name: Configure kernel
        env:
          DEFCONFIG: ${{ steps.defconfig.outputs.name }}
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          echo "Using defconfig: $DEFCONFIG"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- \
            "$DEFCONFIG"

      # ------------------------------------------------------------
      # 9. Show important configuration
      # ------------------------------------------------------------
      - name: Show final kernel configuration
        run: |
          set -e

          echo "===== Important configuration ====="

          grep -E \
            'CONFIG_(ARM64|ARM64_VA_BITS|SMP|MODULES|COMPAT|COMPAT_VDSO|KPROBES|KPROBE_EVENTS|BUILD_ARM64_UNCOMPRESSED_KERNEL|CC_IS_CLANG|LD_IS_LLD)' \
            out/.config || true

          echo
          echo "===== Kernel version ====="

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- \
            kernelversion

      # ------------------------------------------------------------
      # 10. Test the ARM32 Clang target before full build
      # ------------------------------------------------------------
      - name: Test ARM32 vDSO compiler target
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          echo "Testing Clang ARM32 target..."

          clang \
            --target=arm-linux-gnueabihf \
            -march=armv8-a \
            -mfloat-abi=soft \
            -mabi=aapcs-linux \
            -c \
            -x c \
            /dev/null \
            -o /tmp/arm32-test.o

          echo "ARM32 Clang compilation succeeded."

          file /tmp/arm32-test.o

      # ------------------------------------------------------------
      # 11. Build kernel
      # ------------------------------------------------------------
      - name: Build kernel
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          echo "Starting kernel build..."

          make \
            -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-

      # ------------------------------------------------------------
      # 12. Locate generated kernel images
      # ------------------------------------------------------------
      - name: Locate kernel image
        run: |
          set -e

          echo "===== ARM64 boot output ====="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort

          echo
          echo "===== Searching for kernel image ====="

          found=0

          for image in \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.lz4 \
            out/arch/arm64/boot/Image.lz4-dtb
          do
            if [ -f "$image" ]; then
              echo "FOUND: $image"
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No usable ARM64 kernel image was produced."
            exit 1
          fi

      # ------------------------------------------------------------
      # 13. Collect kernel artifacts
      # ------------------------------------------------------------
      - name: Collect build artifacts
        run: |
          set -e

          rm -rf artifacts
          mkdir -p artifacts

          echo "===== Copying kernel configuration ====="

          cp -v \
            out/.config \
            artifacts/kernel.config

          echo
          echo "===== Copying kernel images ====="

          for image in \
            Image.gz-dtb \
            Image.gz \
            Image \
            Image.lz4 \
            Image.lz4-dtb
          do
            if [ -f "out/arch/arm64/boot/$image" ]; then
              cp -v \
                "out/arch/arm64/boot/$image" \
                "artifacts/$image"
            fi
          done

          echo
          echo "===== Copying DTBs ====="

          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              \( -name '*.dtb' -o -name '*.dtbo' \) \
              -print \
              | sort

            find out/arch/arm64/boot/dts \
              -type f \
              \( -name '*.dtb' -o -name '*.dtbo' \) \
              -exec cp --parents {} artifacts/ \;
          fi

          echo
          echo "===== Artifact contents ====="

          find artifacts \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort

      # ------------------------------------------------------------
      # 14. Upload artifacts
      # ------------------------------------------------------------
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-vanilla-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
