name: Build vanilla SM6115 kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # Kernel source
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_samsung_sm6115
          ref: lineage-23.2
          fetch-depth: 1

      # ============================================================
      # Build dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            wget \
            xz-utils

      # ============================================================
      # Inspect kernel source
      # ============================================================

      - name: Show kernel information
        run: |
          echo "========================================"
          echo "Kernel Makefile"
          echo "========================================"

          head -n 30 Makefile

          echo
          echo "========================================"
          echo "ARM64 directory"
          echo "========================================"

          ls -la arch/arm64/

          echo
          echo "========================================"
          echo "Possible gta4l / SM6115 defconfigs"
          echo "========================================"

          find arch/arm64/configs -type f \
            \( \
              -iname '*gta4l*' \
              -o -iname '*sm6115*' \
            \) \
            -print \
            | sort || true

      # ============================================================
      # Find device defconfig
      # ============================================================

      - name: Find device defconfig
        id: defconfig
        shell: bash
        run: |
          set -e

          echo "Searching for gta4l defconfig..."

          DEFCONFIG="$(
            find arch/arm64/configs -type f \
              \( \
                -iname '*gta4l*defconfig' \
                -o -iname '*gta4l*config' \
              \) \
              | sort \
              | head -n 1
          )"

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::Could not automatically find a gta4l defconfig."

            echo
            echo "Available defconfigs:"
            find arch/arm64/configs -type f | sort

            exit 1
          fi

          DEFCONFIG="${DEFCONFIG#arch/arm64/configs/}"

          echo
          echo "========================================"
          echo "Selected defconfig"
          echo "========================================"
          echo "$DEFCONFIG"

          echo "name=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # ============================================================
      # LLVM / Clang
      # ============================================================

      - name: Download LLVM toolchain
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          echo "========================================"
          echo "Downloading LLVM/Clang 12.0.1"
          echo "========================================"

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            --show-progress \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.1/clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz" \
            -O /tmp/clang.tar.xz

          echo
          echo "========================================"
          echo "Extracting LLVM/Clang"
          echo "========================================"

          tar \
            -xf /tmp/clang.tar.xz \
            -C "$GITHUB_WORKSPACE/toolchain" \
            --strip-components=1

          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

          echo
          echo "========================================"
          echo "Clang version"
          echo "========================================"

          "$GITHUB_WORKSPACE/toolchain/bin/clang" --version

          echo
          echo "========================================"
          echo "LLD version"
          echo "========================================"

          "$GITHUB_WORKSPACE/toolchain/bin/ld.lld" --version

      # ============================================================
      # Prepare output directory
      # ============================================================

      - name: Prepare build directory
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/out"

      # ============================================================
      # Kernel configuration
      # ============================================================

      - name: Configure kernel
        env:
          DEFCONFIG: ${{ steps.defconfig.outputs.name }}
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          echo "========================================"
          echo "Configuring kernel"
          echo "========================================"

          echo "Architecture : arm64"
          echo "Defconfig    : $DEFCONFIG"
          echo

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

      # ============================================================
      # Inspect resulting configuration
      # ============================================================

      - name: Show final kernel configuration
        run: |
          set -e

          echo "========================================"
          echo "Important kernel configuration"
          echo "========================================"

          grep -E \
            'CONFIG_(ARM64|SMP|MODULES|KPROBES|KPROBE_EVENTS|BUILD_ARM64_UNCOMPRESSED_KERNEL)' \
            out/.config \
            || true

          echo
          echo "========================================"
          echo "Kernel version"
          echo "========================================"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            kernelversion

      # ============================================================
      # Build kernel
      # ============================================================

      - name: Build kernel
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          echo "========================================"
          echo "Building kernel"
          echo "========================================"

          echo "CPU threads: $(nproc)"
          echo

          make \
            -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      # ============================================================
      # Locate kernel image
      # ============================================================

      - name: Locate kernel image
        run: |
          set -e

          echo "========================================"
          echo "Kernel output files"
          echo "========================================"

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort

          echo
          echo "========================================"
          echo "Candidate kernel images"
          echo "========================================"

          found=0

          for image in \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.lz4 \
            out/arch/arm64/boot/Image.lz4-dtb
          do
            if [ -f "$image" ]; then
              echo "FOUND: $image"
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No usable ARM64 kernel image was produced."
            exit 1
          fi

      # ============================================================
      # Collect artifacts
      # ============================================================

      - name: Collect build artifacts
        run: |
          set -e

          mkdir -p artifacts

          echo "========================================"
          echo "Collecting kernel configuration"
          echo "========================================"

          cp -v \
            out/.config \
            artifacts/kernel.config

          echo
          echo "========================================"
          echo "Collecting kernel images"
          echo "========================================"

          for image in \
            Image.gz-dtb \
            Image.gz \
            Image \
            Image.lz4 \
            Image.lz4-dtb
          do
            if [ -f "out/arch/arm64/boot/$image" ]; then
              cp -v \
                "out/arch/arm64/boot/$image" \
                "artifacts/$image"
            fi
          done

          echo
          echo "========================================"
          echo "Collecting DTBs / DTBOs"
          echo "========================================"

          if [ -d out/arch/arm64/boot/dts ]; then

            find out/arch/arm64/boot/dts \
              -type f \
              \( \
                -name '*.dtb' \
                -o -name '*.dtbo' \
              \) \
              -print \
              | sort

          fi

          echo
          echo "========================================"
          echo "Artifacts"
          echo "========================================"

          find artifacts \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort

      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-vanilla-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
