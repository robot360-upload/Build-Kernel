name: Build ReSukiSU - Galaxy Tab A7 SM-T505

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      KERNEL_REPO: LineageOS/android_kernel_samsung_sm6115
      KERNEL_BRANCH: lineage-23.2

      CLANG_REPO: LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b
      CLANG_BRANCH: lineage-20.0

      KERNEL_DIR: ${{ github.workspace }}/kernel
      CLANG_DIR: ${{ github.workspace }}/clang-r416183b
      OUT_DIR: ${{ github.workspace }}/out

    steps:

      # ============================================================
      # Dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            cpio \
            rsync \
            python3 \
            unzip \
            zip \
            curl \
            wget \
            ca-certificates \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ============================================================
      # Clone kernel
      # ============================================================

      - name: Clone LineageOS SM6115 kernel
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "https://github.com/${KERNEL_REPO}.git" \
            "${KERNEL_DIR}"

          cd "${KERNEL_DIR}"

          echo "========================================"
          echo "Kernel repository"
          echo "========================================"

          git remote -v
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse HEAD)"

          echo
          echo "Kernel version:"
          make kernelversion

      # ============================================================
      # Clone exact LineageOS clang
      # ============================================================

      - name: Clone clang-r416183b
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${CLANG_BRANCH}" \
            "https://github.com/${CLANG_REPO}.git" \
            "${CLANG_DIR}"

          echo "========================================"
          echo "Clang"
          echo "========================================"

          "${CLANG_DIR}/bin/clang" --version

          test -x "${CLANG_DIR}/bin/clang"
          test -x "${CLANG_DIR}/bin/ld.lld"

      # ============================================================
      # Verify source
      # ============================================================

      - name: Verify kernel source
        working-directory: kernel
        run: |
          set -e

          for file in \
            fs/stat.c \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            kernel/reboot.c \
            arch/arm64/configs/vendor/bengal-perf_defconfig \
            arch/arm64/configs/vendor/gta4l-common.config
          do
            test -f "$file"
          done

          echo "[PASS] Required kernel files exist"

      # ============================================================
      # Install ReSukiSU
      # ============================================================

      - name: Install ReSukiSU
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf KernelSU

          git clone \
            --depth=1 \
            --single-branch \
            https://github.com/ReSukiSU/ReSukiSU.git \
            KernelSU

          test -d KernelSU/kernel
          test -f KernelSU/kernel/Kconfig

          echo "========================================"
          echo "ReSukiSU commit"
          echo "========================================"

          git -C KernelSU rev-parse HEAD

          DRIVER_DIR="$PWD/drivers"

          test -d "$DRIVER_DIR"

          rm -f "$DRIVER_DIR/kernelsu"

          ln -s \
            "$(realpath --relative-to="$DRIVER_DIR" "$PWD/KernelSU/kernel")" \
            "$DRIVER_DIR/kernelsu"

          if ! grep -qF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            "$DRIVER_DIR/Makefile"; then

            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
              >> "$DRIVER_DIR/Makefile"
          fi

          if ! grep -qF \
            'source "drivers/kernelsu/Kconfig"' \
            "$DRIVER_DIR/Kconfig"; then

            printf '\nsource "drivers/kernelsu/Kconfig"\n' \
              >> "$DRIVER_DIR/Kconfig"
          fi

          test -L "$DRIVER_DIR/kernelsu"

          echo "[PASS] ReSukiSU installed"

      # ============================================================
      # Force manual hook as Kconfig choice default
      # ============================================================

      - name: Force ReSukiSU manual hook mode
        working-directory: kernel
        run: |
          set -e

          KSU_KCONFIG="KernelSU/kernel/Kconfig"

          test -f "$KSU_KCONFIG"

          echo "========================================"
          echo "Original ReSukiSU hook choice"
          echo "========================================"

          grep -n -A20 \
            'prompt "KernelSU Hooking Method"' \
            "$KSU_KCONFIG"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("KernelSU/kernel/Kconfig")
          text = path.read_text()

          marker = 'prompt "KernelSU Hooking Method"'

          start = text.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: KernelSU Hooking Method choice not found"
              )

          end = text.find(
              'config KSU_TRACEPOINT_HOOK',
              start
          )

          if end == -1:
              raise SystemExit(
                  "ERROR: KSU_TRACEPOINT_HOOK config not found"
              )

          block = text[start:end]

          old = "default KSU_TRACEPOINT_HOOK"
          new = "default KSU_MANUAL_HOOK"

          if old in block:
              block = block.replace(old, new, 1)

              text = text[:start] + block + text[end:]

              path.write_text(text)

              print(
                  "[PASS] ReSukiSU default changed "
                  "to KSU_MANUAL_HOOK"
              )

          elif new in block:
              print(
                  "[OK] KSU_MANUAL_HOOK already default"
              )

          else:
              print(block)
              raise SystemExit(
                  "ERROR: Expected Kconfig default not found"
              )
          PY

          echo
          echo "========================================"
          echo "Modified ReSukiSU hook choice"
          echo "========================================"

          grep -n -A20 \
            'prompt "KernelSU Hooking Method"' \
            "$KSU_KCONFIG"

          grep -A5 \
            'prompt "KernelSU Hooking Method"' \
            "$KSU_KCONFIG" \
            | grep -q \
            'default KSU_MANUAL_HOOK'

          echo "[PASS] Manual hook selected as default"

      # ============================================================
      # Prepare GTA4L config
      # ============================================================

      - name: Prepare GTA4L configuration
        working-directory: kernel
        run: |
          set -e

          CONFIG="arch/arm64/configs/vendor/gta4l-common.config"

          cp "$CONFIG" "${CONFIG}.original"

          sed -i \
            '/^[[:space:]]*CONFIG_KSU=y[[:space:]]*$/d' \
            "$CONFIG"

          sed -i \
            '/^[[:space:]]*CONFIG_KSU_MANUAL_HOOK=y[[:space:]]*$/d' \
            "$CONFIG"

          sed -i \
            '/^[[:space:]]*CONFIG_KSU_TRACEPOINT_HOOK=y[[:space:]]*$/d' \
            "$CONFIG"

          echo "========================================"
          echo "GTA4L KSU settings"
          echo "========================================"

          if grep -q '^CONFIG_KSU' "$CONFIG"; then
            grep '^CONFIG_KSU' "$CONFIG"
          else
            echo "[PASS] No old KSU settings"
          fi

      # ============================================================
      # Clean source tree and create O= build directory
      # ============================================================

      - name: Prepare out-of-tree build
        working-directory: kernel
        run: |
          set -e

          export OUT_DIR="${GITHUB_WORKSPACE}/out"

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          # Clean anything accidentally generated in source.
          rm -f \
            .config \
            Module.symvers \
            System.map \
            modules.order

          rm -rf \
            include/config \
            include/generated \
            arch/arm64/include/generated

          echo "========================================"
          echo "Source tree check"
          echo "========================================"

          for f in \
            .config \
            Module.symvers \
            System.map \
            modules.order
          do
            if [ -e "$f" ]; then
              echo "[FAIL] Source artifact remains: $f"
              exit 1
            fi
          done

          for d in \
            include/config \
            include/generated \
            arch/arm64/include/generated
          do
            if [ -e "$d" ]; then
              echo "[FAIL] Source generated directory remains: $d"
              exit 1
            fi
          done

          echo "[PASS] Source tree clean"
          echo "[PASS] Output directory: ${OUT_DIR}"

      # ============================================================
      # Apply required ReSukiSU hooks
      #
      # Kernel = Linux 4.19
      #
      # Required:
      #   stat
      #   execveat
      #   faccessat
      #   reboot
      #   read
      #
      # Current ReSukiSU also checks post_execveat.
      # ============================================================

      - name: Apply ReSukiSU manual hooks
        working-directory: kernel
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def require(text, needle, description):
              if needle not in text:
                  raise SystemExit(
                      f"[FAIL] Required source pattern not found: {description}"
                  )

          def once(text, old, new, description):
              count = text.count(old)

              if count == 0:
                  raise SystemExit(
                      f"[FAIL] Hook insertion point not found: {description}"
                  )

              if count > 1:
                  raise SystemExit(
                      f"[FAIL] Hook insertion point is ambiguous: "
                      f"{description} ({count} matches)"
                  )

              return text.replace(old, new, 1)

          # ========================================================
          # fs/exec.c
          # ========================================================

          path = Path("fs/exec.c")
          text = read(path)

          require(
              text,
              "static int do_execveat_common(int fd, struct filename *filename,",
              "do_execveat_common"
          )

          if "ksu_handle_execveat" not in text:

              declaration = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                                          void *argv, void *envp, int *flags);
          __attribute__((hot))
          extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr,
                                               void *argv, void *envp, int *flags,
                                               int *retval);
          #endif

          '''

              marker = "static int do_execveat_common(int fd, struct filename *filename,"

              text = text.replace(
                  marker,
                  declaration + marker,
                  1
              )

              body = """{
          #ifdef CONFIG_KSU_MANUAL_HOOK
                  int retval;

                  ksu_handle_execveat(
                      &fd,
                      &filename,
                      &argv,
                      &envp,
                      &flags
                  );

                  retval = __do_execve_file(
                      fd,
                      filename,
                      argv,
                      envp,
                      flags,
                      NULL
                  );

                  ksu_handle_post_execveat(
                      &fd,
                      &filename,
                      &argv,
                      &envp,
                      &flags,
                      &retval
                  );

                  return retval;
          #else
                  return __do_execve_file(fd, filename, argv, envp, flags, NULL);
          #endif
          """

              old = """{
                  return __do_execve_file(fd, filename, argv, envp, flags, NULL);
              """

              if old not in text:
                  # Allow whitespace differences while still refusing
                  # to patch an unknown source layout.
                  pattern = re.compile(
                      r'(\n\{)\n'
                      r'(\s*)return __do_execve_file\('
                      r'fd, filename, argv, envp, flags, NULL\);'
                  )

                  match = pattern.search(text)

                  if not match:
                      raise SystemExit(
                          "[FAIL] Could not locate do_execveat_common body"
                      )

                  replacement = "\n" + body.rstrip()

                  text = (
                      text[:match.start()]
                      + replacement
                      + text[match.end():]
                  )

              else:
                  text = text.replace(
                      old,
                      body,
                      1
                  )

              write(path, text)

              print("[PASS] execveat hook applied")

          else:
              print("[OK] execveat hook already present")

          # ========================================================
          # fs/stat.c
          # ========================================================

          path = Path("fs/stat.c")
          text = read(path)

          if "ksu_handle_stat" not in text:

              marker = (
                  "#if !defined(__ARCH_WANT_STAT64) "
                  "|| defined(__ARCH_WANT_SYS_NEWFSTATAT)"
              )

              require(
                  text,
                  marker,
                  "newfstatat declaration location"
              )

              declaration = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(
                  int *dfd,
                  const char __user **filename_user,
                  int *flags);

          extern void ksu_handle_newfstat_ret(
                  unsigned int *fd,
                  struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
                  unsigned long *fd,
                  struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          '''

              text = text.replace(
                  marker,
                  declaration + marker,
                  1
              )

              # newfstatat
              pattern = re.compile(
                  r'(SYSCALL_DEFINE4\(newfstatat,.*?\n'
                  r'.*?\{\n)',
                  re.S
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "[FAIL] newfstatat function not found"
                  )

              hook = """#ifdef CONFIG_KSU_MANUAL_HOOK
                  ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          """

              text = (
                  text[:match.end()]
                  + hook
                  + text[match.end():]
              )

              # fstatat64
              pattern = re.compile(
                  r'(SYSCALL_DEFINE4\(fstatat64,.*?\n'
                  r'.*?\{\n)',
                  re.S
              )

              match = pattern.search(text)

              if match:
                  text = (
                      text[:match.end()]
                      + """#ifdef CONFIG_KSU_MANUAL_HOOK
                  ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          """
                      + text[match.end():]
                  )
                  print("[PASS] fstatat64 hook applied")
              else:
                  print("[WARN] fstatat64 not found")

              # newfstat return hook
              pattern = re.compile(
                  r'(SYSCALL_DEFINE2\(newfstat,.*?\n'
                  r'.*?\{\n.*?'
                  r'if \(!error\)\n'
                  r'.*?cp_new_stat\(&stat, statbuf\);\n)',
                  re.S
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "[FAIL] newfstat function not found"
                  )

              text = (
                  text[:match.end()]
                  + """#ifdef CONFIG_KSU_MANUAL_HOOK
                  ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          """
                  + text[match.end():]
              )

              # fstat64 return hook
              pattern = re.compile(
                  r'(SYSCALL_DEFINE2\(fstat64,.*?\n'
                  r'.*?\{\n.*?'
                  r'if \(!error\)\n'
                  r'.*?cp_new_stat64\(&stat, statbuf\);\n)',
                  re.S
              )

              match = pattern.search(text)

              if match:
                  text = (
                      text[:match.end()]
                      + """#ifdef CONFIG_KSU_MANUAL_HOOK
                  ksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
          """
                      + text[match.end():]
                  )
                  print("[PASS] fstat64 return hook applied")
              else:
                  print("[WARN] fstat64 not found")

              write(path, text)

              print("[PASS] stat hooks applied")

          else:
              print("[OK] stat hooks already present")

          # ========================================================
          # fs/open.c
          # ========================================================

          path = Path("fs/open.c")
          text = read(path)

          if "ksu_handle_faccessat" not in text:

              declaration = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(
                  int *dfd,
                  const char __user **filename_user,
                  int *mode,
                  int *flags);
          #endif

          '''

              marker = "SYSCALL_DEFINE3(faccessat,"

              index = text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "[FAIL] faccessat syscall not found"
                  )

              text = (
                  text[:index]
                  + declaration
                  + text[index:]
              )

              # Find opening brace of faccessat.
              index = text.find(marker)

              brace = text.find("{", index)

              if brace == -1:
                  raise SystemExit(
                      "[FAIL] faccessat body not found"
                  )

              hook = """
          #ifdef CONFIG_KSU_MANUAL_HOOK
                  ksu_handle_faccessat(
                          &dfd,
                          &filename,
                          &mode,
                          NULL
                  );
          #endif
          """

              text = (
                  text[:brace + 1]
                  + hook
                  + text[brace + 1:]
              )

              write(path, text)

              print("[PASS] faccessat hook applied")

          else:
              print("[OK] faccessat hook already present")

          # ========================================================
          # kernel/reboot.c
          # ========================================================

          path = Path("kernel/reboot.c")
          text = read(path)

          if "ksu_handle_sys_reboot" not in text:

              declaration = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(
                  int magic1,
                  int magic2,
                  unsigned int cmd,
                  void __user **arg);
          #endif

          '''

              marker = "SYSCALL_DEFINE4(reboot,"

              index = text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "[FAIL] reboot syscall not found"
                  )

              text = (
                  text[:index]
                  + declaration
                  + text[index:]
              )

              index = text.find(marker)

              brace = text.find("{", index)

              if brace == -1:
                  raise SystemExit(
                      "[FAIL] reboot body not found"
                  )

              hook = """
          #ifdef CONFIG_KSU_MANUAL_HOOK
                  ksu_handle_sys_reboot(
                          magic1,
                          magic2,
                          cmd,
                          &arg
                  );
          #endif
          """

              text = (
                  text[:brace + 1]
                  + hook
                  + text[brace + 1:]
              )

              write(path, text)

              print("[PASS] reboot hook applied")

          else:
              print("[OK] reboot hook already present")

          # ========================================================
          # fs/read_write.c
          # ========================================================

          path = Path("fs/read_write.c")
          text = read(path)

          if "ksu_handle_sys_read" not in text:

              declaration = r'''
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern bool ksu_init_rc_hook __read_mostly;

          extern __attribute__((cold))
          int ksu_handle_sys_read(
                  unsigned int fd,
                  char __user **buf_ptr,
                  size_t *count_ptr);
          #endif

          '''

              marker = "SYSCALL_DEFINE3(read,"

              index = text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "[FAIL] read syscall not found"
                  )

              text = (
                  text[:index]
                  + declaration
                  + text[index:]
              )

              index = text.find(marker)

              brace = text.find("{", index)

              if brace == -1:
                  raise SystemExit(
                      "[FAIL] read body not found"
                  )

              hook = """
          #ifdef CONFIG_KSU_MANUAL_HOOK
                  if (unlikely(ksu_init_rc_hook))
                          ksu_handle_sys_read(fd, &buf, &count);
          #endif
          """

              text = (
                  text[:brace + 1]
                  + hook
                  + text[brace + 1:]
              )

              write(path, text)

              print("[PASS] sys_read hook applied")

          else:
              print("[OK] sys_read hook already present")

          print()
          print("========================================")
          print("All required ReSukiSU hooks applied")
          print("========================================")
          PY

      # ============================================================
      # Verify manual hooks before configuration/build
      # ============================================================

      - name: Verify ReSukiSU manual hooks
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "Checking required ReSukiSU hooks"
          echo "========================================"

          for pattern in \
            'ksu_handle_stat' \
            'ksu_handle_newfstat_ret' \
            'ksu_handle_execveat' \
            'ksu_handle_post_execveat' \
            'ksu_handle_faccessat' \
            'ksu_handle_sys_reboot' \
            'ksu_handle_sys_read'
          do
            if ! grep -Rqs "$pattern" \
              fs/stat.c \
              fs/exec.c \
              fs/open.c \
              fs/read_write.c \
              kernel/reboot.c; then

              echo "[FAIL] Missing hook: $pattern"
              exit 1
            fi

            echo "[PASS] $pattern"
          done

          echo
          echo "[PASS] All required hooks are present"

      # ============================================================
      # Configure kernel
      #
      # IMPORTANT:
      #   The entire configuration is generated with O=out.
      #
      #   No merge_config.sh is used here, avoiding accidental
      #   writes into the source tree.
      # ============================================================

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          export PATH="${CLANG_DIR}/bin:${PATH}"
          export OUT_DIR="${GITHUB_WORKSPACE}/out"

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          echo "========================================"
          echo "Base defconfig"
          echo "========================================"

          make \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          echo "========================================"
          echo "Create combined configuration fragment"
          echo "========================================"

          cat \
            arch/arm64/configs/vendor/gta4l-common.config \
            > "${OUT_DIR}/gta4l.config"

          cat >> "${OUT_DIR}/gta4l.config" <<'EOF'

          # ========================================
          # ReSukiSU
          # ========================================

          CONFIG_KSU=y
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          CONFIG_KSU_MANUAL_HOOK=y

          # ========================================
          # ARM32 compatibility
          # ========================================

          CONFIG_COMPAT=y

          # The legacy ARM32 VDSO does not assemble correctly
          # with this LLVM/Clang build environment.
          # CONFIG_VDSO32=n
          EOF

          echo "========================================"
          echo "Configuration fragment"
          echo "========================================"

          grep -E \
            '^CONFIG_(KSU|COMPAT|COMPAT_VDSO)' \
            "${OUT_DIR}/gta4l.config" || true

          echo
          echo "========================================"
          echo "Resolve final configuration"
          echo "========================================"

          make \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            KCONFIG_ALLCONFIG="${OUT_DIR}/gta4l.config" \
            alldefconfig

          echo
          echo "========================================"
          echo "Final kernel configuration"
          echo "========================================"

          grep -E \
            '^CONFIG_(KSU|COMPAT|VDSO32)' \
            "${OUT_DIR}/.config" || true

          echo
          echo "========================================"
          echo "Validate KSU configuration"
          echo "========================================"

          KSU="$(
            sed -n \
              's/^CONFIG_KSU=//p' \
              "${OUT_DIR}/.config"
          )"

          MANUAL="$(
            sed -n \
              's/^CONFIG_KSU_MANUAL_HOOK=//p' \
              "${OUT_DIR}/.config"
          )"

          COMPAT="$(
            sed -n \
              's/^CONFIG_COMPAT=//p' \
              "${OUT_DIR}/.config"
          )"

          if [ "$KSU" != "y" ]; then
            echo "[FAIL] CONFIG_KSU is not y"
            exit 1
          fi

          if [ "$MANUAL" != "y" ]; then
            echo "[FAIL] CONFIG_KSU_MANUAL_HOOK is not y"
            exit 1
          fi

          if grep -q \
            '^CONFIG_KSU_TRACEPOINT_HOOK=y' \
            "${OUT_DIR}/.config"; then

            echo "[FAIL] CONFIG_KSU_TRACEPOINT_HOOK=y"
            exit 1
          fi

          if [ "$COMPAT" != "y" ]; then
            echo "[FAIL] CONFIG_COMPAT is not y"
            exit 1
          fi

          if grep -q \
            '^CONFIG_COMPAT_VDSO=y' \
            "${OUT_DIR}/.config"; then

            echo "[FAIL] CONFIG_COMPAT_VDSO=y"
            exit 1
          fi

          echo "[PASS] CONFIG_KSU=y"
          echo "[PASS] CONFIG_KSU_MANUAL_HOOK=y"
          echo "[PASS] CONFIG_KSU_TRACEPOINT_HOOK disabled"
          echo "[PASS] CONFIG_COMPAT=y"
          echo "[PASS] CONFIG_COMPAT_VDSO disabled"

          echo
          echo "========================================"
          echo "Final configuration validation passed"
          echo "========================================"

          echo
          echo "========================================"
          echo "Final configuration validation passed"
          echo "========================================"

      # ============================================================
      # Verify source tree BEFORE build
      # ============================================================

      - name: Verify source tree is clean
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "Source tree artifact check"
          echo "========================================"

          for f in \
            .config \
            Module.symvers \
            System.map \
            modules.order
          do
            if [ -e "$f" ]; then
              echo "[FAIL] $f exists in source tree"
              exit 1
            fi
          done

          for d in \
            include/config \
            include/generated \
            arch/arm64/include/generated
          do
            if [ -e "$d" ]; then
              echo "[FAIL] $d exists in source tree"
              exit 1
            fi
          done

          echo "[PASS] No kernel build artifacts in source tree"

          echo
          echo "Git status:"
          git status --short

      # ============================================================
      # Build
      # ============================================================

      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export PATH="${CLANG_DIR}/bin:${PATH}"

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "========================================"
          echo "Building SM6115 ReSukiSU kernel"
          echo "========================================"

          make \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image \
            Image.gz

      # ============================================================
      # Verify kernel
      # ============================================================

      - name: Verify kernel
        run: |
          set -e

          test -f "${OUT_DIR}/arch/arm64/boot/Image"
          test -f "${OUT_DIR}/arch/arm64/boot/Image.gz"
          test -f "${OUT_DIR}/vmlinux"
          test -f "${OUT_DIR}/System.map"
          test -f "${OUT_DIR}/.config"

          echo "========================================"
          echo "Kernel build successful"
          echo "========================================"

          ls -lh \
            "${OUT_DIR}/arch/arm64/boot/Image" \
            "${OUT_DIR}/arch/arm64/boot/Image.gz" \
            "${OUT_DIR}/vmlinux" \
            "${OUT_DIR}/System.map"

          echo
          echo "Kernel configuration:"
          grep '^CONFIG_KSU' \
            "${OUT_DIR}/.config" || true

          echo
          file \
            "${OUT_DIR}/arch/arm64/boot/Image" \
            "${OUT_DIR}/arch/arm64/boot/Image.gz"

      # ============================================================
      # Package
      # ============================================================

      - name: Package kernel
        run: |
          set -e

          rm -rf kernel-artifact
          mkdir -p kernel-artifact

          cp \
            "${OUT_DIR}/arch/arm64/boot/Image" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/arch/arm64/boot/Image.gz" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/vmlinux" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/System.map" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/.config" \
            kernel-artifact/kernel.config

          cp \
            "${KERNEL_DIR}/arch/arm64/configs/vendor/bengal-perf_defconfig" \
            kernel-artifact/

          cp \
            "${KERNEL_DIR}/arch/arm64/configs/vendor/gta4l-common.config.original" \
            kernel-artifact/gta4l-common.config

          cat > kernel-artifact/BUILD_INFO.txt <<EOF
          Device: Samsung Galaxy Tab A7 SM-T505
          Codename: gta4l
          Kernel: 4.19.325

          Kernel repository:
          ${KERNEL_REPO}

          Kernel branch:
          ${KERNEL_BRANCH}

          Kernel commit:
          $(cd "${KERNEL_DIR}" && git rev-parse HEAD)

          ReSukiSU:
          enabled

          ReSukiSU hook mode:
          Manual Hook

          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_TRACEPOINT_HOOK=n

          Compiler:
          clang-r416183b
          EOF

          tar -czf \
            resukisu-sm6115-kernel.tar.gz \
            -C kernel-artifact .

          echo "========================================"
          echo "Artifact"
          echo "========================================"

          ls -lh resukisu-sm6115-kernel.tar.gz

      # ============================================================
      # Upload
      # ============================================================

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-sm6115-sm-t505
          path: resukisu-sm6115-kernel.tar.gz
          if-no-files-found: error
          retention-days: 14
