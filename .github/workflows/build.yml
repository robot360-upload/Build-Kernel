name: Build ReSukiSU - Galaxy Tab A7 SM-T505

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      KERNEL_REPO: LineageOS/android_kernel_samsung_sm6115
      KERNEL_BRANCH: lineage-23.2
      CLANG_REPO: LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b
      CLANG_BRANCH: lineage-20.0
      KERNEL_DIR: ${{ github.workspace }}/kernel
      CLANG_DIR: ${{ github.workspace }}/clang-r416183b
      OUT_DIR: ${{ github.workspace }}/out

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            cpio \
            rsync \
            python3 \
            python3-pip \
            unzip \
            zip \
            curl \
            wget \
            ca-certificates \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

          echo "===== Checking make ====="
          command -v make
          make --version

      - name: Clone LineageOS SM6115 kernel
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "https://github.com/${KERNEL_REPO}.git" \
            "${KERNEL_DIR}"

          cd "${KERNEL_DIR}"

          echo "Kernel repository:"
          git remote -v
          echo "Branch:"
          git branch --show-current
          echo "Commit:"
          git rev-parse HEAD

      - name: Clone clang-r416183b
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${CLANG_BRANCH}" \
            "https://github.com/${CLANG_REPO}.git" \
            "${CLANG_DIR}"

          "${CLANG_DIR}/bin/clang" --version

      - name: Verify LineageOS kernel tree
        working-directory: kernel
        run: |
          set -e

          test -f fs/stat.c
          test -f fs/exec.c
          test -f fs/open.c
          test -f fs/read_write.c
          test -f kernel/reboot.c

          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f arch/arm64/configs/vendor/gta4l-common.config

          echo "[PASS] Expected kernel files exist"

          echo
          echo "===== Kernel version ====="
          make kernelversion

          echo
          echo "===== Relevant functions ====="

          echo "--- fs/stat.c ---"
          grep -n \
            -E \
            'newfstatat|newfstat|fstat64|fstatat64' \
            fs/stat.c || true

          echo
          echo "--- fs/exec.c ---"
          grep -n \
            -E \
            'do_execveat_common|do_execve|compat_do_execve' \
            fs/exec.c || true

          echo
          echo "--- fs/open.c ---"
          grep -n \
            -E \
            'faccessat' \
            fs/open.c || true

          echo
          echo "--- fs/read_write.c ---"
          grep -n \
            -E \
            'ksys_read|SYSCALL_DEFINE3\(read|read\(' \
            fs/read_write.c || true

          echo
          echo "--- kernel/reboot.c ---"
          grep -n \
            -E \
            'SYSCALL_DEFINE4\(reboot|reboot\(' \
            kernel/reboot.c || true

          echo
          echo "[PASS] Source-tree inspection completed"
          
      - name: Install ReSukiSU
        working-directory: kernel
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Cloning ReSukiSU"
          echo "========================================"

          rm -rf KernelSU

          git clone \
            --depth=1 \
            --single-branch \
            https://github.com/ReSukiSU/ReSukiSU.git \
            KernelSU

          test -d KernelSU
          test -d KernelSU/kernel

          echo
          echo "ReSukiSU commit:"
          git -C KernelSU rev-parse HEAD

          echo
          echo "ReSukiSU repository:"
          git -C KernelSU remote -v

          if [ -d drivers ]; then
            DRIVER_DIR="$PWD/drivers"
          elif [ -d common/drivers ]; then
            DRIVER_DIR="$PWD/common/drivers"
          else
            echo "[FAIL] No kernel drivers directory found"
            exit 1
          fi

          echo
          echo "Driver directory: $DRIVER_DIR"

          rm -f "$DRIVER_DIR/kernelsu"

          ln -s \
            "$(realpath --relative-to="$DRIVER_DIR" "$PWD/KernelSU/kernel")" \
            "$DRIVER_DIR/kernelsu"

          test -L "$DRIVER_DIR/kernelsu"

          echo
          echo "KernelSU symlink:"
          ls -l "$DRIVER_DIR/kernelsu"

          if ! grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' \
              "$DRIVER_DIR/Makefile"; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
              >> "$DRIVER_DIR/Makefile"
          fi

          if ! grep -qF 'source "drivers/kernelsu/Kconfig"' \
              "$DRIVER_DIR/Kconfig"; then
            sed -i \
              '/endmenu/i source "drivers/kernelsu/Kconfig"' \
              "$DRIVER_DIR/Kconfig"
          fi

          echo
          echo "========================================"
          echo "ReSukiSU integration verification"
          echo "========================================"

          grep -nF \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            "$DRIVER_DIR/Makefile"

          grep -nF \
            'source "drivers/kernelsu/Kconfig"' \
            "$DRIVER_DIR/Kconfig"

          test -f "$DRIVER_DIR/kernelsu/Makefile"
          test -f "$DRIVER_DIR/kernelsu/Kconfig"

          echo
          echo "[PASS] ReSukiSU kernel directory installed"
          echo "[PASS] drivers/Makefile integrated"
          echo "[PASS] drivers/Kconfig integrated"

      - name: Enable ReSukiSU configuration
        working-directory: kernel
        run: |
          set -e

          CONFIG="arch/arm64/configs/vendor/gta4l-common.config"

          grep -qxF 'CONFIG_KSU=y' "$CONFIG" || \
            echo 'CONFIG_KSU=y' >> "$CONFIG"

          grep -qxF 'CONFIG_KSU_MANUAL_HOOK=y' "$CONFIG" || \
            echo 'CONFIG_KSU_MANUAL_HOOK=y' >> "$CONFIG"

          echo "========================================"
          echo "ReSukiSU configuration"
          echo "========================================"

          grep '^CONFIG_KSU' "$CONFIG"

      - name: Apply ReSukiSU manual hooks
        working-directory: kernel
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          def die(message):
              print(f"[FAIL] {message}")
              sys.exit(1)

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def insert_after_opening_brace(
              text,
              function_regex,
              code,
              name
          ):
              match = re.search(
                  function_regex + r'\s*\{',
                  text,
                  re.MULTILINE
              )

              if not match:
                  die(f"{name}: function not found")

              brace = text.find("{", match.start(), match.end())

              if brace < 0:
                  die(f"{name}: opening brace not found")

              if code.strip() in text:
                  print(f"[OK] {name}: already patched")
                  return text

              return (
                  text[:brace + 1]
                  + "\n"
                  + code
                  + text[brace + 1:]
              )

          # ========================================================
          # fs/stat.c
          # ========================================================

          path = "fs/stat.c"
          text = load(path)

          declarations = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(
              int *dfd,
              const char __user **filename_user,
              int *flags);

          extern void ksu_handle_newfstat_ret(
              unsigned int *fd,
              struct stat __user **statbuf_ptr);

          #if defined(__ARCH_WANT_STAT64) || \
              defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(
              unsigned long *fd,
              struct stat64 __user **statbuf_ptr);
          #endif
          #endif
          """

          if "extern int ksu_handle_stat(" not in text:
              anchor = re.search(
                  r'^SYSCALL_DEFINE4\(newfstatat,',
                  text,
                  re.MULTILINE
              )

              if not anchor:
                  die("stat: newfstatat syscall not found")

              text = (
                  text[:anchor.start()]
                  + declarations.strip()
                  + "\n\n"
                  + text[anchor.start():]
              )

              print("[OK] stat declarations inserted")

          newfstatat = (
              r'SYSCALL_DEFINE4\(newfstatat,\s*'
              r'int,\s*dfd,\s*'
              r'const char __user \*,\s*filename,\s*'
              r'struct stat __user \*,\s*statbuf,\s*'
              r'int,\s*flag\)'
          )

          text = insert_after_opening_brace(
              text,
              newfstatat,
              r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          """,
              "stat/newfstatat"
          )

          fstatat64 = (
              r'SYSCALL_DEFINE4\(fstatat64,\s*'
              r'int,\s*dfd,\s*'
              r'const char __user \*,\s*filename,\s*'
              r'struct stat64 __user \*,\s*statbuf,\s*'
              r'int,\s*flag\)'
          )

          match = re.search(
              fstatat64 + r'\s*\{.*?\n\}',
              text,
              re.MULTILINE | re.DOTALL
          )

          if not match:
              die("stat: fstatat64 syscall not found")

          if "ksu_handle_stat(&dfd, &filename, &flag)" not in match.group(0):
              text = insert_after_opening_brace(
                  text,
                  fstatat64,
                  r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          """,
                  "stat/fstatat64"
              )

          newfstat = (
              r'SYSCALL_DEFINE2\(newfstat,\s*'
              r'unsigned int,\s*fd,\s*'
              r'struct stat __user \*,\s*statbuf\)'
          )

          match = re.search(
              newfstat + r'\s*\{.*?\n\}',
              text,
              re.MULTILINE | re.DOTALL
          )

          if not match:
              die("stat: newfstat function not found")

          body = match.group(0)

          if "ksu_handle_newfstat_ret(&fd, &statbuf)" not in body:
              return_match = re.search(
                  r'(\n\s*return\s+error;)',
                  body
              )

              if not return_match:
                  die("stat: newfstat return anchor not found")

              hook = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
              """

              body = (
                  body[:return_match.start()]
                  + "\n"
                  + hook
                  + body[return_match.start():]
              )

              text = (
                  text[:match.start()]
                  + body
                  + text[match.end():]
              )

          fstat64 = (
              r'SYSCALL_DEFINE2\(fstat64,\s*'
              r'unsigned long,\s*fd,\s*'
              r'struct stat64 __user \*,\s*statbuf\)'
          )

          match = re.search(
              fstat64 + r'\s*\{.*?\n\}',
              text,
              re.MULTILINE | re.DOTALL
          )

          if not match:
              die("stat: fstat64 function not found")

          body = match.group(0)

          if "ksu_handle_fstat64_ret(&fd, &statbuf)" not in body:
              return_match = re.search(
                  r'(\n\s*return\s+error;)',
                  body
              )

              if not return_match:
                  die("stat: fstat64 return anchor not found")

              hook = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_fstat64_ret(&fd, &statbuf);
          #endif
              """

              body = (
                  body[:return_match.start()]
                  + "\n"
                  + hook
                  + body[return_match.start():]
              )

              text = (
                  text[:match.start()]
                  + body
                  + text[match.end():]
              )

          save(path, text)

          # ========================================================
          # fs/exec.c
          # ========================================================

          path = "fs/exec.c"
          text = load(path)

          exec_declarations = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(
              int *fd,
              struct filename **filename_ptr,
              void *argv,
              void *envp,
              int *flags);

          __attribute__((hot))
          extern int ksu_handle_post_execveat(
              int *fd,
              struct filename **filename_ptr,
              void *argv,
              void *envp,
              int *flags,
              int *retval);
          #endif
          """

          if "extern int ksu_handle_execveat(" not in text:
              anchor = re.search(
                  r'^static int do_execveat_common\(',
                  text,
                  re.MULTILINE
              )

              if not anchor:
                  die("exec: do_execveat_common not found")

              text = (
                  text[:anchor.start()]
                  + exec_declarations.strip()
                  + "\n\n"
                  + text[anchor.start():]
              )

          common = (
              r'static int do_execveat_common\('
              r'\s*int fd,\s*'
              r'struct filename \*filename,\s*'
              r'struct user_arg_ptr argv,\s*'
              r'struct user_arg_ptr envp,\s*'
              r'int flags\)'
          )

          match = re.search(
              common + r'\s*\{.*?\n\}',
              text,
              re.MULTILINE | re.DOTALL
          )

          if not match:
              die("exec: do_execveat_common body not found")

          body = match.group(0)

          if "ksu_handle_post_execveat(" not in body:
              old = (
                  "return __do_execve_file("
                  "fd, filename, argv, envp, flags, NULL);"
              )

              if old not in body:
                  die(
                      "exec: expected __do_execve_file() "
                      "return statement not found"
                  )

              new = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              int retval;

              ksu_handle_execveat(
                  &fd,
                  &filename,
                  &argv,
                  &envp,
                  &flags);

              retval = __do_execve_file(
                  fd,
                  filename,
                  argv,
                  envp,
                  flags,
                  NULL);

              ksu_handle_post_execveat(
                  &fd,
                  &filename,
                  &argv,
                  &envp,
                  &flags,
                  &retval);

              return retval;
          #else
              return __do_execve_file(
                  fd, filename, argv, envp, flags, NULL);
          #endif
              """

              body = body.replace(
                  old,
                  new.strip(),
                  1
              )

              text = (
                  text[:match.start()]
                  + body
                  + text[match.end():]
              )

          save(path, text)

          # ========================================================
          # fs/open.c
          # ========================================================

          path = "fs/open.c"
          text = load(path)

          if "extern int ksu_handle_faccessat(" not in text:
              anchor = re.search(
                  r'^SYSCALL_DEFINE3\(faccessat,',
                  text,
                  re.MULTILINE
              )

              if not anchor:
                  die("open: faccessat not found")

              declarations = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(
              int *dfd,
              const char __user **filename_user,
              int *mode,
              int *flags);
          #endif
              """

              text = (
                  text[:anchor.start()]
                  + declarations.strip()
                  + "\n\n"
                  + text[anchor.start():]
              )

          faccessat = (
              r'SYSCALL_DEFINE3\(faccessat,\s*'
              r'int,\s*dfd,\s*'
              r'const char __user \*,\s*filename,\s*'
              r'int,\s*mode\)'
          )

          text = insert_after_opening_brace(
              text,
              faccessat,
              r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_faccessat(
                  &dfd,
                  &filename,
                  &mode,
                  NULL);
          #endif
          """,
              "open/faccessat"
          )

          save(path, text)

          # ========================================================
          # fs/read_write.c
          # ========================================================

          path = "fs/read_write.c"
          text = load(path)

          if "ksu_handle_sys_read(" not in text:
              anchor = re.search(
                  r'^SYSCALL_DEFINE3\(read,',
                  text,
                  re.MULTILINE
              )

              if not anchor:
                  die("read: read syscall not found")

              declarations = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern bool ksu_init_rc_hook __read_mostly;

          extern __attribute__((cold)) int ksu_handle_sys_read(
              unsigned int fd,
              char __user **buf_ptr,
              size_t *count_ptr);
          #endif
              """

              text = (
                  text[:anchor.start()]
                  + declarations.strip()
                  + "\n\n"
                  + text[anchor.start():]
              )

          read_function = (
              r'SYSCALL_DEFINE3\(read,\s*'
              r'unsigned int,\s*fd,\s*'
              r'char __user \*,\s*buf,\s*'
              r'size_t,\s*count\)'
          )

          text = insert_after_opening_brace(
              text,
              read_function,
              r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              if (unlikely(ksu_init_rc_hook))
                  ksu_handle_sys_read(fd, &buf, &count);
          #endif
          """,
              "read"
          )

          save(path, text)

          # ========================================================
          # kernel/reboot.c
          # ========================================================

          path = "kernel/reboot.c"
          text = load(path)

          if "extern int ksu_handle_sys_reboot(" not in text:
              anchor = re.search(
                  r'^SYSCALL_DEFINE4\(reboot,',
                  text,
                  re.MULTILINE
              )

              if not anchor:
                  die("reboot: reboot syscall not found")

              declarations = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(
              int magic1,
              int magic2,
              unsigned int cmd,
              void __user **arg);
          #endif
              """

              text = (
                  text[:anchor.start()]
                  + declarations.strip()
                  + "\n\n"
                  + text[anchor.start():]
              )

          reboot = (
              r'SYSCALL_DEFINE4\(reboot,\s*'
              r'int,\s*magic1,\s*'
              r'int,\s*magic2,\s*'
              r'unsigned int,\s*cmd,\s*'
              r'void __user \*,\s*arg\)'
          )

          text = insert_after_opening_brace(
              text,
              reboot,
              r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_sys_reboot(
                  magic1,
                  magic2,
                  cmd,
                  &arg);
          #endif
          """,
              "reboot"
          )

          save(path, text)

          # ========================================================
          # Verification
          # ========================================================

          print()
          print("========================================")
          print("Final hook verification")
          print("========================================")

          checks = {
              "fs/stat.c": [
                  "ksu_handle_stat(&dfd, &filename, &flag)",
                  "ksu_handle_newfstat_ret(&fd, &statbuf)",
                  "ksu_handle_fstat64_ret(&fd, &statbuf)",
              ],
              "fs/exec.c": [
                  "ksu_handle_execveat(",
                  "ksu_handle_post_execveat(",
              ],
              "fs/open.c": [
                  "ksu_handle_faccessat(",
              ],
              "fs/read_write.c": [
                  "ksu_init_rc_hook",
                  "ksu_handle_sys_read(fd, &buf, &count)",
              ],
              "kernel/reboot.c": [
                  "ksu_handle_sys_reboot(",
              ],
          }

          for filename, needles in checks.items():
              data = load(filename)

              for needle in needles:
                  if needle not in data:
                      die(
                          f"{filename}: missing required hook: "
                          f"{needle}"
                      )

              print(f"[PASS] {filename}")

          print()
          print("[PASS] All required ReSukiSU hooks are present.")
          PY

      - name: Show ReSukiSU modifications
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "ReSukiSU configuration"
          echo "========================================"

          grep '^CONFIG_KSU' \
            arch/arm64/configs/vendor/gta4l-common.config

          echo
          echo "========================================"
          echo "ReSukiSU hooks"
          echo "========================================"

          grep -R -n \
            -E \
            'ksu_handle_(stat|newfstat_ret|fstat64_ret|execveat|post_execveat|faccessat|sys_read|sys_reboot)' \
            fs/stat.c \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            kernel/reboot.c

      - name: Configure kernel
        working-directory: kernel
        env:
          PATH: ${{ env.CLANG_DIR }}/bin:${{ env.PATH }}
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          scripts/kconfig/merge_config.sh \
            -m \
            "${OUT_DIR}/.config" \
            arch/arm64/configs/vendor/gta4l-common.config

          make \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "Final KSU configuration:"
          grep '^CONFIG_KSU' "${OUT_DIR}/.config"

          grep -qxF \
            'CONFIG_KSU=y' \
            "${OUT_DIR}/.config"

          grep -qxF \
            'CONFIG_KSU_MANUAL_HOOK=y' \
            "${OUT_DIR}/.config"

          echo "[PASS] CONFIG_KSU=y"
          echo "[PASS] CONFIG_KSU_MANUAL_HOOK=y"

      - name: Build kernel
        working-directory: kernel
        env:
          PATH: ${{ env.CLANG_DIR }}/bin:${{ env.PATH }}
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image \
            Image.gz

      - name: Verify kernel
        run: |
          set -e

          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"
          IMAGE_GZ="${OUT_DIR}/arch/arm64/boot/Image.gz"

          test -f "$IMAGE"
          test -f "$IMAGE_GZ"
          test -f "${OUT_DIR}/vmlinux"
          test -f "${OUT_DIR}/System.map"
          test -f "${OUT_DIR}/.config"

          echo "========================================"
          echo "Build successful"
          echo "========================================"

          ls -lh \
            "$IMAGE" \
            "$IMAGE_GZ" \
            "${OUT_DIR}/vmlinux" \
            "${OUT_DIR}/System.map"

          file "$IMAGE"
          file "$IMAGE_GZ"

      - name: Package kernel
        run: |
          set -e

          mkdir -p kernel-artifact

          cp \
            "${OUT_DIR}/arch/arm64/boot/Image" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/arch/arm64/boot/Image.gz" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/vmlinux" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/System.map" \
            kernel-artifact/

          cp \
            "${OUT_DIR}/.config" \
            kernel-artifact/kernel.config

          cp \
            "${KERNEL_DIR}/arch/arm64/configs/vendor/bengal-perf_defconfig" \
            kernel-artifact/

          cp \
            "${KERNEL_DIR}/arch/arm64/configs/vendor/gta4l-common.config" \
            kernel-artifact/

          cat > kernel-artifact/BUILD_INFO.txt <<EOF
          Device: Samsung Galaxy Tab A7 SM-T505
          Codename: gta4l
          Kernel: 4.19.325
          Kernel repository: ${KERNEL_REPO}
          Kernel branch: ${KERNEL_BRANCH}
          Kernel commit: $(cd "${KERNEL_DIR}" && git rev-parse HEAD)
          ReSukiSU: enabled
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          Compiler: clang-r416183b
          EOF

          tar -czf \
            resukisu-sm6115-kernel.tar.gz \
            -C kernel-artifact .

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-sm6115-kernel
